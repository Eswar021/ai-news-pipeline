<!doctype html>
<html data-composition-variables='[
  {"id":"src","type":"string","label":"Image path (local)","default":"assets/images/placeholder-1.png"},
  {"id":"x","type":"number","label":"Focus X (%)","default":62},
  {"id":"y","type":"number","label":"Focus Y (%)","default":46}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:transparent; --accent:#FF8A3D; }
        .img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform; }
        .dim { position:absolute; inset:0; background:rgba(4,7,11,0.74); will-change:opacity; }
        .ring { position:absolute; width:120px; height:120px; border:4px solid var(--accent);
          border-radius:50%; box-shadow:0 0 26px rgba(255,138,61,0.5); }
      </style>

      <div id="root" data-composition-id="spotlight" data-width="1920" data-height="1080">
        <img class="img" src="assets/images/placeholder-1.png" alt="" />
        <div class="dim"></div>
        <div class="ring"></div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="spotlight"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const src = get("src", "assets/images/placeholder-1.png");
          const x = parseFloat(get("x", 62));
          const y = parseFloat(get("y", 46));

          const img = R.querySelector(".img");
          const dim = R.querySelector(".dim");
          const ring = R.querySelector(".ring");
          img.src = src;

          // Punch a soft hole in the dim overlay at the focus point.
          const mask = `radial-gradient(circle at ${x}% ${y}%, transparent 8%, transparent 13%, #000 30%)`;
          dim.style.webkitMaskImage = mask;
          dim.style.maskImage = mask;
          ring.style.left = (x / 100 * 1920) + "px";
          ring.style.top = (y / 100 * 1080) + "px";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(img, { scale: 1.02 }, { scale: 1.09, duration: 10, ease: "none" }, 0);
          tl.fromTo(dim, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.1);
          tl.fromTo(ring, { scale: 0, opacity: 0, xPercent: -50, yPercent: -50 }, { scale: 1, opacity: 1, xPercent: -50, yPercent: -50, duration: 0.5, ease: "back.out(2)" }, 0.35);
          window.__timelines["spotlight"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

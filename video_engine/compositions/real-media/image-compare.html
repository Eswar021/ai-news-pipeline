<!doctype html>
<html data-composition-variables='[
  {"id":"beforeLabel","type":"string","label":"Before label","default":"Before"},
  {"id":"afterLabel","type":"string","label":"After label","default":"After"},
  {"id":"caption","type":"string","label":"Caption","default":""},
  {"id":"beforeQuery","type":"string","label":"Before image desc","default":""},
  {"id":"afterQuery","type":"string","label":"After image desc","default":""},
  {"id":"beforeSrc","type":"string","label":"Before file (resolver)","default":"assets/images/placeholder-1.png"},
  {"id":"afterSrc","type":"string","label":"After file (resolver)","default":"assets/images/placeholder-2.png"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden; background:#06090E;
          --text:#E6EDF3; --accent:#FF8A3D; --accent-2:#3DD6D0;
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text);
        }
        .img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform, opacity; }
        .scrim { position:absolute; inset:0; background:linear-gradient(0deg, rgba(6,9,14,0.72) 0%, rgba(6,9,14,0) 34%); }
        .tag { position:absolute; left:110px; bottom:120px; display:flex; align-items:center; gap:16px;
          font-family:var(--fm); font-size:36px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
          background:rgba(6,9,14,0.66); padding:16px 28px; border-radius:14px; }
        .tag .bar { width:46px; height:6px; border-radius:3px; }
        .tag.before { color:var(--text); } .tag.before .bar { background:var(--text); }
        .tag.after { color:var(--accent); } .tag.after .bar { background:var(--accent); }
        .tag.after { left:auto; right:110px; flex-direction:row-reverse; }
        .cap { position:absolute; left:0; right:0; bottom:210px; text-align:center; }
        .cap span { display:inline-block; background:rgba(6,9,14,0.66); padding:16px 34px; border-radius:14px;
          font-size:40px; font-weight:600; }
      </style>

      <div id="root" data-composition-id="image-compare" data-width="1920" data-height="1080">
        <img class="img before" alt="" />
        <img class="img after" alt="" />
        <div class="scrim"></div>
        <div class="cap"><span class="ctext"></span></div>
        <div class="tag before"><span class="bar"></span><span class="btext"></span></div>
        <div class="tag after"><span class="bar"></span><span class="atext"></span></div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="image-compare"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          R.querySelector(".before").src = get("beforeSrc", "assets/images/placeholder-1.png");
          R.querySelector(".after").src = get("afterSrc", "assets/images/placeholder-2.png");
          R.querySelector(".btext").textContent = get("beforeLabel", "Before");
          R.querySelector(".atext").textContent = get("afterLabel", "After");
          const cap = get("caption", ""); const cEl = R.querySelector(".ctext");
          cEl.textContent = cap; if (!cap) cEl.style.display = "none";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          // before holds, then after cross-dissolves in place (temporal transform)
          tl.fromTo(R.querySelector(".before"), { scale: 1.04 }, { scale: 1.12, duration: 9, ease: "none" }, 0);
          tl.fromTo(R.querySelector(".after"), { scale: 1.12 }, { scale: 1.04, duration: 9, ease: "none" }, 0);
          tl.fromTo(R.querySelector(".tag.before"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
          tl.fromTo(R.querySelector(".after"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 2.4);
          tl.fromTo(R.querySelector(".tag.after"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.7);
          if (cap) tl.fromTo(cEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          window.__timelines["image-compare"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

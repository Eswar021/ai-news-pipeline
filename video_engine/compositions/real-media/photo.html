<!doctype html>
<html data-composition-variables='[
  {"id":"src","type":"string","label":"Image path (local)","default":"assets/images/placeholder-1.png"},
  {"id":"motion","type":"enum","label":"Motion","default":"ken-burns-in","options":[
    {"value":"ken-burns-in","label":"Ken Burns In"},
    {"value":"ken-burns-out","label":"Ken Burns Out"},
    {"value":"pan-left","label":"Pan Left"},
    {"value":"pan-right","label":"Pan Right"}
  ]}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:transparent; }
        .img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform; }
      </style>

      <div id="root" data-composition-id="photo" data-width="1920" data-height="1080">
        <img class="img" src="assets/images/placeholder-1.png" alt="" />
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="photo"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const src = get("src", "assets/images/placeholder-1.png");
          const motion = get("motion", "ken-burns-in");

          const img = R.querySelector(".img");
          img.src = src;

          // Slow, continuous move over 10s (linear) — any slot <=10s stays in motion.
          const M = {
            "ken-burns-in":  [{ scale: 1.06, x: 0,   y: 0 },   { scale: 1.20, x: -26, y: -14 }],
            "ken-burns-out": [{ scale: 1.20, x: -26, y: -14 }, { scale: 1.06, x: 0,   y: 0 }],
            "pan-left":      [{ scale: 1.14, x: 34,  y: 0 },   { scale: 1.14, x: -34, y: 0 }],
            "pan-right":     [{ scale: 1.14, x: -34, y: 0 },   { scale: 1.14, x: 34,  y: 0 }]
          };
          const [from, to] = M[motion] || M["ken-burns-in"];

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(img, from, { ...to, duration: 10, ease: "none" }, 0);
          window.__timelines["photo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

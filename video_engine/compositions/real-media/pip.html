<!doctype html>
<html data-composition-variables='[
  {"id":"mainLabel","type":"string","label":"Main label","default":""},
  {"id":"pipLabel","type":"string","label":"Inset label","default":""},
  {"id":"corner","type":"string","label":"Inset corner (br|bl|tr|tl)","default":"br"},
  {"id":"mainQuery","type":"string","label":"Main image desc","default":""},
  {"id":"pipQuery","type":"string","label":"Inset image desc","default":""},
  {"id":"mainSrc","type":"string","label":"Main file (resolver)","default":"assets/images/placeholder-1.png"},
  {"id":"pipSrc","type":"string","label":"Inset file (resolver)","default":"assets/images/placeholder-2.png"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:#06090E;
          --text:#E6EDF3; --accent:#FF8A3D; --fm:"JetBrains Mono",ui-monospace,monospace; }
        .main { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform; }
        .mainscrim { position:absolute; inset:0; background:radial-gradient(120% 100% at 70% 70%, rgba(0,0,0,0.5), rgba(0,0,0,0) 55%); }
        .pip { position:absolute; width:660px; height:400px; border-radius:20px; overflow:hidden; border:3px solid rgba(255,255,255,0.9);
          box-shadow:0 30px 70px rgba(0,0,0,0.6); will-change:transform; }
        .pip img { width:100%; height:100%; object-fit:cover; }
        .pip.br { right:90px; bottom:110px; } .pip.bl { left:90px; bottom:110px; }
        .pip.tr { right:90px; top:110px; } .pip.tl { left:90px; top:110px; }
        .tag { position:absolute; font-family:var(--fm); font-size:28px; font-weight:700; letter-spacing:0.06em;
          color:#fff; background:rgba(6,9,14,0.66); padding:12px 22px; border-radius:10px; }
        .tag.main-t { left:90px; top:100px; } .tag.pip-t { bottom:14px; left:14px; }
      </style>

      <div id="root" data-composition-id="pip" data-width="1920" data-height="1080">
        <img class="main" alt="" />
        <div class="mainscrim"></div>
        <div class="tag main-t mtext"></div>
        <div class="pip"><img class="pimg" alt="" /><div class="tag pip-t ptext"></div></div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="pip"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          R.querySelector(".main").src = get("mainSrc", "assets/images/placeholder-1.png");
          R.querySelector(".pimg").src = get("pipSrc", "assets/images/placeholder-2.png");
          const pip = R.querySelector(".pip");
          pip.classList.add(["br", "bl", "tr", "tl"].includes(get("corner", "br")) ? get("corner", "br") : "br");
          const ml = get("mainLabel", ""); const mEl = R.querySelector(".mtext"); mEl.textContent = ml; if (!ml) mEl.style.display = "none";
          const pl = get("pipLabel", ""); const pEl = R.querySelector(".ptext"); pEl.textContent = pl; if (!pl) pEl.style.display = "none";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R.querySelector(".main"), { scale: 1.04 }, { scale: 1.12, duration: 10, ease: "none" }, 0);
          tl.fromTo(pip, { opacity: 0, scale: 0.8, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" }, 0.4);
          if (ml) tl.fromTo(mEl, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
          window.__timelines["pip"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

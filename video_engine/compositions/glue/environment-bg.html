<!doctype html>
<html data-composition-variables='[
  {"id":"tint","type":"string","label":"Horizon tint (warm|cool)","default":"cool"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --deep:#05070B; --line:rgba(61,214,208,0.35);
          --warm:rgba(255,138,61,0.55); --cool:rgba(61,214,208,0.5);
        }
        .base { position:absolute; inset:0;
          background:linear-gradient(180deg, #0B1220 0%, var(--bg) 46%, #0A0E16 62%, var(--deep) 100%); }
        .horizon { position:absolute; left:0; right:0; top:60%; height:3px; will-change:opacity; }
        .glow { position:absolute; left:50%; top:60%; width:1500px; height:520px; transform:translate(-50%,-50%);
          border-radius:50%; filter:blur(60px); will-change:transform, opacity; }
        .stage { position:absolute; left:0; right:0; top:60%; bottom:0; perspective:520px; perspective-origin:50% 0%; overflow:hidden; }
        .floor { position:absolute; left:-50%; top:0; width:200%; height:1400px; transform:rotateX(78deg); transform-origin:top center; }
        .floor .lines { position:absolute; inset:-40% 0; will-change:transform;
          background-image:linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px);
          background-size:120px 120px; opacity:0.5; }
        .vig { position:absolute; inset:0; pointer-events:none;
          background:radial-gradient(120% 100% at 50% 60%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%); }
      </style>

      <div id="root" data-composition-id="environment-bg" data-width="1920" data-height="1080">
        <div class="base"></div>
        <div class="glow"></div>
        <div class="horizon"></div>
        <div class="stage"><div class="floor"><div class="lines"></div></div></div>
        <div class="vig"></div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="environment-bg"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const tint = get("tint", "cool");
          const c = tint === "warm" ? "var(--warm)" : "var(--cool)";
          R.querySelector(".glow").style.background = "radial-gradient(circle at 50% 50%, " + c + " 0%, rgba(0,0,0,0) 70%)";
          R.querySelector(".horizon").style.background = "linear-gradient(90deg, rgba(0,0,0,0), " + c + ", rgba(0,0,0,0))";
          R.querySelector(".horizon").style.boxShadow = "0 0 40px " + c;
          if (tint === "warm") R.querySelector(".lines").style.setProperty("--line", "rgba(255,138,61,0.35)");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          // forward motion: scroll the grid one cell along the tilted plane, looping
          tl.fromTo(R.querySelector(".lines"), { y: 0 }, { y: 120, duration: 2.2, ease: "none", repeat: 6 }, 0);
          tl.fromTo(R.querySelector(".glow"), { opacity: 0.7, scale: 0.95 }, { opacity: 1, scale: 1.08, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          window.__timelines["environment-bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

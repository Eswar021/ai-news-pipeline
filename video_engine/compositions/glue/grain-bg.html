<!doctype html>
<html data-composition-variables='[
  {"id":"tint","type":"string","label":"Haze tint (warm|cool|neutral)","default":"neutral"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --deep:#06090E;
          --warm:rgba(255,138,61,0.16); --cool:rgba(61,214,208,0.14); --neutral:rgba(150,170,200,0.12);
        }
        .base { position:absolute; inset:0;
          background:radial-gradient(135% 115% at 50% 30%, #121826 0%, var(--bg) 56%, var(--deep) 100%); }
        .haze { position:absolute; width:1500px; height:1500px; left:50%; top:40%; transform:translate(-50%,-50%);
          border-radius:50%; filter:blur(40px); will-change:transform; }
        .grain { position:absolute; inset:-20%; opacity:0.06; mix-blend-mode:screen; pointer-events:none; }
        .vig { position:absolute; inset:0; pointer-events:none;
          background:radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.62) 100%); }
      </style>

      <div id="root" data-composition-id="grain-bg" data-width="1920" data-height="1080">
        <div class="base"></div>
        <div class="haze"></div>
        <svg class="grain" xmlns="http://www.w3.org/2000/svg">
          <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/></filter>
          <rect width="100%" height="100%" filter="url(#grainf)"/>
        </svg>
        <div class="vig"></div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="grain-bg"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const tint = get("tint", "neutral");
          const hue = tint === "warm" ? "var(--warm)" : tint === "cool" ? "var(--cool)" : "var(--neutral)";
          R.querySelector(".haze").style.background = "radial-gradient(circle at 50% 50%, " + hue + " 0%, rgba(0,0,0,0) 70%)";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R.querySelector(".haze"), { x: -80, y: -30, scale: 1.0 }, { x: 80, y: 40, scale: 1.15, duration: 14, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          window.__timelines["grain-bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

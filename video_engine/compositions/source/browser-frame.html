<!doctype html>
<html data-composition-variables='[
  {"id":"src","type":"string","label":"Image path (local)","default":"assets/images/placeholder-3.png"},
  {"id":"url","type":"string","label":"Address-bar URL","default":"openai.com"},
  {"id":"caption","type":"string","label":"Caption (optional)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --chrome:#20262F; --chrome-2:#171C24; --text:#E6EDF3; --text-dim:#8B94A3;
          --accent:#FF8A3D; --border:rgba(230,237,243,0.14);
          --fd:"Montserrat",-apple-system,system-ui,sans-serif; --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(130% 100% at 50% 12%, #16202F 0%, var(--bg) 55%, #06090E 100%); }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; }
        .window { width:1440px; height:812px; border-radius:18px; overflow:hidden; background:var(--chrome-2);
          border:1.5px solid var(--border); box-shadow:0 40px 120px rgba(0,0,0,0.55); will-change:transform,opacity; }
        .chrome { height:56px; background:var(--chrome); display:flex; align-items:center; gap:20px; padding:0 22px;
          border-bottom:1px solid var(--border); }
        .dots { display:flex; gap:10px; flex:none; }
        .dot { width:15px; height:15px; border-radius:50%; }
        .dot.r{background:#FF5F57;} .dot.y{background:#FEBC2E;} .dot.g{background:#28C840;}
        .addr { flex:1; height:34px; border-radius:9px; background:#0E1219; border:1px solid var(--border);
          display:flex; align-items:center; padding:0 16px; gap:10px; overflow:hidden; }
        .addr .lock { width:12px; height:12px; border:2px solid var(--text-dim); border-radius:3px; flex:none; }
        .addr .u { font-family:var(--fm); font-size:20px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .viewport { position:relative; width:100%; height:calc(100% - 56px); overflow:hidden; background:#0E1219; }
        .shot { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; will-change:transform; }
        .load { position:absolute; left:0; top:0; height:3px; background:var(--accent); width:100%; transform-origin:left center; will-change:transform; }
        .caption { font-family:var(--fm); font-size:26px; letter-spacing:0.04em; color:var(--text-dim); text-align:center; max-width:1400px; will-change:transform,opacity; }
      </style>

      <div id="root" data-composition-id="browser-frame" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="stage">
          <div class="window">
            <div class="chrome">
              <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
              <div class="addr"><span class="lock"></span><span class="u"></span></div>
            </div>
            <div class="viewport">
              <img class="shot" src="assets/images/placeholder-3.png" alt="" />
              <div class="load"></div>
            </div>
          </div>
          <div class="caption"></div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="browser-frame"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;

          const src = get("src", "assets/images/placeholder-3.png");
          const caption = get("caption", "");
          // Show a clean host/path in the address bar; strip scheme + querystring.
          let url = String(get("url", "")).trim().replace(/^https?:\/\//i, "").replace(/[?#].*$/, "").replace(/\/$/, "");
          if (url.length > 72) url = url.slice(0, 71) + "…";

          R.querySelector(".shot").src = src;
          R.querySelector(".addr .u").textContent = url || "";
          const capEl = R.querySelector(".caption");
          if (caption) capEl.textContent = caption; else capEl.style.display = "none";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          const win = R.querySelector(".window");
          tl.fromTo(win, { opacity: 0, y: 34, scale: 0.965 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.3)" }, 0);
          tl.fromTo(R.querySelector(".load"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.25);
          tl.to(R.querySelector(".load"), { opacity: 0, duration: 0.3, ease: "power1.out" }, 0.85);
          // Sustained slow push so the shot never sits fully static under the narration.
          tl.fromTo(R.querySelector(".shot"), { scale: 1.06 }, { scale: 1.14, duration: 12, ease: "none" }, 0.2);
          if (caption) tl.fromTo(capEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          window.__timelines["browser-frame"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"The content pipeline"},
  {"id":"steps","type":"string","label":"Steps (array of strings)","default":""},
  {"id":"center","type":"string","label":"Center label","default":"DAILY"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --surface:#161C26; --text:#E6EDF3; --text-dim:#8B94A3;
          --accent:#FF8A3D; --accent-2:#3DD6D0; --border:rgba(230,237,243,0.14);
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(120% 100% at 50% 42%, #16202F 0%, var(--bg) 52%, #06090E 100%); }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }
        .title { font-family:var(--fm); font-size:30px; letter-spacing:0.10em; text-transform:uppercase;
          color:var(--accent); font-weight:700; margin-bottom:26px; text-align:center; }
        .ring-wrap { position:relative; width:760px; height:760px; }
        .ring { position:absolute; inset:0; }
        .ring circle { fill:none; stroke:var(--accent); stroke-width:3; opacity:0.55; }
        .node { position:absolute; transform:translate(-50%,-50%); background:var(--surface);
          border:1.5px solid var(--border); border-radius:999px; padding:22px 34px; font-size:34px;
          font-weight:700; white-space:nowrap; will-change:transform; box-shadow:0 8px 30px rgba(0,0,0,0.4); }
        .arw { position:absolute; will-change:transform; }
        .arw svg { width:30px; height:30px; display:block; }
        .center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
          font-family:var(--fm); font-size:44px; font-weight:700; letter-spacing:0.08em; color:var(--accent-2); }
      </style>

      <div id="root" data-composition-id="cycle" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="stage">
          <div class="title ttext"></div>
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 760 760"><circle class="ringpath" cx="380" cy="380" r="250" transform="rotate(-90 380 380)" /></svg>
            <div class="center ctext"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="cycle"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          R.querySelector(".ttext").textContent = get("title", "The content pipeline");
          if (!get("title", "x")) R.querySelector(".title").style.display = "none";
          R.querySelector(".ctext").textContent = get("center", "DAILY");
          if (!get("center", "x")) R.querySelector(".center").style.display = "none";

          let steps = V.steps;
          if (!Array.isArray(steps)) steps = ["Collect", "Script", "Voiceover", "Visuals", "Publish"];

          const wrap = R.querySelector(".ring-wrap");
          const cx = 380, cy = 380, r = 250, N = steps.length;
          steps.forEach((s, i) => {
            const a = -Math.PI / 2 + i * 2 * Math.PI / N;
            const node = document.createElement("div"); node.className = "node"; node.textContent = s;
            node.style.left = (cx + r * Math.cos(a)) + "px";
            node.style.top = (cy + r * Math.sin(a)) + "px";
            wrap.appendChild(node);
            const ma = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / N;
            const arw = document.createElement("div"); arw.className = "arw";
            arw.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 4 L16 12 L8 20" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            arw.style.left = (cx + r * Math.cos(ma)) + "px";
            arw.style.top = (cy + r * Math.sin(ma)) + "px";
            arw.style.transform = "translate(-50%,-50%) rotate(" + (ma * 180 / Math.PI + 90) + "deg)";
            wrap.appendChild(arw);
          });

          const ring = R.querySelector(".ringpath");
          const C = 2 * Math.PI * r;
          ring.style.strokeDasharray = C;

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R.querySelector(".title"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
          tl.fromTo(ring, { strokeDashoffset: C }, { strokeDashoffset: 0, duration: 1.3, ease: "power1.inOut" }, 0.2);
          tl.fromTo(R.querySelectorAll(".node"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)", stagger: 0.22 }, 0.35);
          tl.fromTo(R.querySelectorAll(".arw"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.22 }, 0.6);
          tl.fromTo(R.querySelector(".center"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.2);
          window.__timelines["cycle"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

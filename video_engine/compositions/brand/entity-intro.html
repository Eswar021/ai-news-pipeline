<!doctype html>
<html data-composition-variables='[
  {"id":"entity","type":"string","label":"Entity name","default":"OpenAI"},
  {"id":"tagline","type":"string","label":"Tagline","default":"AI research & deployment"},
  {"id":"logo","type":"string","label":"Logo file (filled by asset resolver)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --text:#E6EDF3; --text-dim:#8B94A3; --accent:#FF8A3D;
          --chip:#F4F5F7;
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(130% 110% at 50% 18%, #16202F 0%, var(--bg) 55%, #06090E 100%); }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:52px; padding:0 120px; }
        .chip { width:300px; height:300px; border-radius:40px; background:var(--chip);
          display:flex; align-items:center; justify-content:center; padding:56px;
          box-shadow:0 30px 70px rgba(0,0,0,0.5); will-change:transform; }
        .chip img { width:100%; height:100%; object-fit:contain; }
        .name { font-size:88px; font-weight:800; letter-spacing:-0.02em; line-height:1; text-align:center; }
        .tag { font-family:var(--fm); font-size:30px; letter-spacing:0.06em; color:var(--text-dim);
          text-transform:uppercase; text-align:center; margin-top:-24px; }
        /* text-only fallback when no logo resolved */
        .stage.nologo .chip { display:none; }
        .stage.nologo .name { font-size:120px; }
      </style>

      <div id="root" data-composition-id="entity-intro" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="stage">
          <div class="chip"><img class="limg" alt="" /></div>
          <div class="name ntext"></div>
          <div class="tag ttext"></div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="entity-intro"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const entity = get("entity", "OpenAI");
          const tagline = get("tagline", "AI research & deployment");
          const logo = get("logo", "");
          const stage = R.querySelector(".stage");

          R.querySelector(".ntext").textContent = entity;
          const tagEl = R.querySelector(".ttext");
          tagEl.textContent = tagline;
          if (!tagline) tagEl.style.display = "none";

          if (logo) { R.querySelector(".limg").setAttribute("src", logo); }
          else { stage.classList.add("nologo"); }

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          if (logo) tl.fromTo(R.querySelector(".chip"), { opacity: 0, scale: 0.8, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" }, 0);
          tl.fromTo(R.querySelector(".name"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo(tagEl, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.5);
          window.__timelines["entity-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html data-composition-variables='[
  {"id":"entity","type":"string","label":"Entity name","default":"NVIDIA"},
  {"id":"logo","type":"string","label":"Logo file (asset resolver)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --text:#E6EDF3; --accent:#FF8A3D; --chip:#F4F5F7;
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(120% 110% at 50% 45%, #16202F 0%, var(--bg) 50%, #06090E 100%); }
        .glow { position:absolute; left:50%; top:44%; width:900px; height:900px; transform:translate(-50%,-50%);
          border-radius:50%; background:radial-gradient(circle at 50% 50%, rgba(255,138,61,0.22), rgba(0,0,0,0) 68%);
          filter:blur(30px); will-change:transform, opacity; }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:46px; }
        .chipwrap { position:relative; }
        .chip { width:400px; height:400px; border-radius:52px; background:var(--chip);
          display:flex; align-items:center; justify-content:center; padding:72px;
          box-shadow:0 40px 90px rgba(0,0,0,0.55); will-change:transform; }
        .chip img { width:100%; height:100%; object-fit:contain; }
        /* moving shine sweep across the chip */
        .shine { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:52px; overflow:hidden; pointer-events:none; }
        .shine .stripe { position:absolute; top:-40%; left:0; width:46%; height:180%;
          background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
          transform:rotate(8deg); will-change:transform; }
        .name { font-size:76px; font-weight:800; letter-spacing:-0.01em; }
        .stage.nologo .chipwrap { display:none; }
        .stage.nologo .name { font-size:132px; }
      </style>

      <div id="root" data-composition-id="logo-reveal" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="glow"></div>
        <div class="stage">
          <div class="chipwrap"><div class="chip"><img class="limg" alt="" /></div><div class="shine"><div class="stripe"></div></div></div>
          <div class="name ntext"></div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="logo-reveal"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const entity = get("entity", "NVIDIA");
          const logo = get("logo", "");
          R.querySelector(".ntext").textContent = entity;
          const stage = R.querySelector(".stage");
          if (logo) R.querySelector(".limg").setAttribute("src", logo);
          else stage.classList.add("nologo");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R.querySelector(".glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0);
          if (logo) {
            tl.fromTo(R.querySelector(".chip"), { opacity: 0, scale: 0.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.15);
            tl.fromTo(R.querySelector(".stripe"), { xPercent: -160 }, { xPercent: 380, duration: 0.9, ease: "power1.inOut" }, 0.65);
          }
          tl.fromTo(R.querySelector(".name"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.5);
          window.__timelines["logo-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html data-composition-variables='[
  {"id":"leftEntity","type":"string","label":"Left entity","default":"OpenAI"},
  {"id":"rightEntity","type":"string","label":"Right entity","default":"Anthropic"},
  {"id":"label","type":"string","label":"Label over the vs","default":""},
  {"id":"leftLogo","type":"string","label":"Left logo (asset resolver)","default":""},
  {"id":"rightLogo","type":"string","label":"Right logo (asset resolver)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --text:#E6EDF3; --text-dim:#8B94A3; --accent:#FF8A3D; --accent-2:#3DD6D0;
          --chip:#F4F5F7;
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(130% 110% at 50% 16%, #16202F 0%, var(--bg) 55%, #06090E 100%); }
        .label { position:absolute; top:150px; width:100%; text-align:center; font-family:var(--fm);
          font-size:30px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
        .stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:90px; }
        .side { display:flex; flex-direction:column; align-items:center; gap:34px; will-change:transform; }
        .chip { width:280px; height:280px; border-radius:38px; background:var(--chip);
          display:flex; align-items:center; justify-content:center; padding:52px;
          box-shadow:0 26px 64px rgba(0,0,0,0.5); }
        .chip img { width:100%; height:100%; object-fit:contain; }
        .side.nologo .chip { background:#161C26; border:1.5px solid rgba(230,237,243,0.12); }
        .who { font-size:52px; font-weight:800; letter-spacing:-0.01em; }
        .vs { font-family:var(--fd); font-size:76px; font-weight:900; color:var(--accent-2);
          letter-spacing:0.02em; flex:none; will-change:transform; }
      </style>

      <div id="root" data-composition-id="logo-vs-logo" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="label ltext"></div>
        <div class="stage">
          <div class="side left"><div class="chip"><img class="limg" alt="" /></div><div class="who lwho"></div></div>
          <div class="vs">VS</div>
          <div class="side right"><div class="chip"><img class="rimg" alt="" /></div><div class="who rwho"></div></div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="logo-vs-logo"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          const setSide = (cls, entity, logo) => {
            const side = R.querySelector(".side." + cls);
            side.querySelector(".who").textContent = entity;
            if (logo) side.querySelector("img").setAttribute("src", logo);
            else side.classList.add("nologo");
          };
          setSide("left", get("leftEntity", "OpenAI"), get("leftLogo", ""));
          setSide("right", get("rightEntity", "Anthropic"), get("rightLogo", ""));
          const label = get("label", "");
          const labEl = R.querySelector(".ltext");
          labEl.textContent = label;
          if (!label) labEl.style.display = "none";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(labEl, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
          tl.fromTo(R.querySelector(".side.left"), { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.15);
          tl.fromTo(R.querySelector(".side.right"), { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo(R.querySelector(".vs"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.55);
          window.__timelines["logo-vs-logo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

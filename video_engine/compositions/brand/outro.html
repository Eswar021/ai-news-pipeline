<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"Closing line","default":"That’s the week."},
  {"id":"subtitle","type":"string","label":"Call to action","default":"Back soon with whatever breaks next"},
  {"id":"handle","type":"string","label":"Channel handle","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position:absolute; inset:0; overflow:hidden;
          --bg:#0B0E14; --text:#E6EDF3; --text-dim:#8B94A3; --accent:#FF8A3D;
          --fd:"Montserrat",-apple-system,system-ui,sans-serif;
          --fm:"JetBrains Mono",ui-monospace,monospace;
          font-family:var(--fd); color:var(--text); background:transparent;
        }
        .bg { position:absolute; inset:0;
          background:radial-gradient(130% 110% at 50% 40%, #141D2B 0%, var(--bg) 55%, #06090E 100%); }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; padding:0 160px; }
        .title { font-size:110px; font-weight:800; letter-spacing:-0.02em; line-height:1.05; text-align:center; }
        .sub { font-size:44px; font-weight:500; color:var(--text-dim); text-align:center; max-width:1300px; line-height:1.3; }
        .handle { display:flex; align-items:center; gap:16px; font-family:var(--fm); font-size:34px; letter-spacing:0.08em;
          color:var(--accent); font-weight:700; margin-top:26px; }
        .handle .bar { width:44px; height:5px; background:var(--accent); border-radius:3px; }
      </style>

      <div id="root" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="stage">
          <div class="title ttext"></div>
          <div class="sub stext"></div>
          <div class="handle"><span class="bar"></span><span class="htext"></span></div>
        </div>
      </div>

      <script>
        (function () {
          const R = document.querySelector('[data-composition-id="outro"]');
          const HF = window.__hyperframes;
          const V = (HF && HF.getVariables) ? HF.getVariables() : {};
          const get = (k, d) => (V[k] !== undefined && V[k] !== null) ? V[k] : d;
          R.querySelector(".ttext").textContent = get("title", "That’s the week.");
          const sub = get("subtitle", "Back soon with whatever breaks next");
          const sEl = R.querySelector(".stext"); sEl.textContent = sub; if (!sub) sEl.style.display = "none";
          const handle = get("handle", "");
          const hWrap = R.querySelector(".handle"); R.querySelector(".htext").textContent = handle;
          if (!handle) hWrap.style.display = "none";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R.querySelector(".title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo(sEl, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.45);
          tl.fromTo(hWrap, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.7);
          window.__timelines["outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

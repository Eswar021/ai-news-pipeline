# Run Defaults — system-wide defaults for every run.
# Read by Layer 0 (run_request_parser.py + budget_depth_controller.py).

defaults:
  timezone: "Asia/Kolkata"
  run_profile: "auto_48h"
  target_format: "auto"
  lookback_hours: 48
  depth: "standard"
  max_videos: 1
  topic_focus: "AI news"

depth_profiles:
  light:
    max_raw_documents_to_process: 200
    max_story_clusters: 20
    max_ranked_stories_to_analyze: 8
    max_stories_for_roundup: 5
    max_deep_dive_candidates: 1
    max_claims_per_story: 10
    max_script_drafts: 1
    max_title_options: 5

  standard:
    max_raw_documents_to_process: 500
    max_story_clusters: 50
    max_ranked_stories_to_analyze: 15
    max_stories_for_roundup: 8
    max_deep_dive_candidates: 3
    max_claims_per_story: 20
    max_script_drafts: 1
    max_title_options: 10

  deep:
    max_raw_documents_to_process: 1000
    max_story_clusters: 100
    max_ranked_stories_to_analyze: 25
    max_stories_for_roundup: 8
    max_deep_dive_candidates: 5
    max_claims_per_story: 30
    max_script_drafts: 2
    max_title_options: 15

scheduled_runs:
  ai_news_roundup:
    frequency: "every_48_hours"
    run_profile: "roundup_48h"
    target_format: "roundup"
    lookback_hours: 48
    depth: "standard"

  weekly_deep_dive:
    frequency: "weekly"
    run_profile: "deep_dive_weekly"
    target_format: "deep_dive"
    lookback_hours: 168
    depth: "deep"

  evergreen_research:
    frequency: "biweekly"
    target_format: "evergreen"   # placeholder until an evergreen run profile is added
    lookback_hours: 720
    depth: "deep"

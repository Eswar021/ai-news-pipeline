# Run Profiles
# The single source of truth for run-type-specific collection and editorial policy.
#
# Registry files answer "what sources/channels exist?"
# Run profiles answer "how should this run behave?"

defaults:
  default_profile: auto_48h
  profile_aliases:
    auto: auto_48h
    daily: daily_48h_all_sources
    roundup: roundup_48h
    deep_dive: deep_dive_weekly

profiles:
  daily_48h_all_sources:
    description: "Strict two-day all-sources monitoring run. Every active source group uses the same 48-hour window, and Layer 5 may choose roundup vs deep dive."
    target_format: auto
    decision_mode: auto_route
    allowed_formats:
      - roundup
      - deep_dive
    lookback_hours: 48
    depth: standard
    max_videos: 1
    source_plan:
      required_groups:
        - ai_company_blogs
        - tech_news_apis
        - research_papers
        - community_signals
        - github_open_source_signals
        - youtube_podcast_transcripts
      optional_groups: []
      priority_order:
        - ai_company_blogs
        - tech_news_apis
        - research_papers
        - youtube_podcast_transcripts
        - github_open_source_signals
        - community_signals
      query_theme_set: default
      minimum_expected_documents: 20
      maximum_expected_documents: 400
    collection_windows:
      default:
        mode: inherit_base
      overrides: {}
    youtube:
      channel_selection: all_enabled
      max_per_duration: 2
      channel_overrides:
        UCSHZKyawb77ixDdsGog4iWA:
          max_per_duration: 1
    collection_caps:
      ai_company_blogs:
        max_per_source: 10
      tech_news_apis:
        max_per_source: 10
      research_papers:
        max_per_category: 8
      community_signals:
        max_stories: 15
      github_open_source_signals:
        max_per_query: 4
    layer_limits:
      layer_4:
        max_stories: 12
        max_documents_per_story: 6
        document_overflow_char_limit: 12000
        roundup_min_verified_claims: 2
        deep_dive_min_verified_claims: 8
        deep_dive_requires_primary_source: true
        high_severity_contradiction_blocks_deep_dive: true
      layer_5:
        novelty_skip_threshold: 45
        roundup_min_stories: 5
        roundup_max_stories: 8
        roundup_min_selection_score: 65
        deep_dive_min_selection_score: 80
    memory_windows:
      published_video_similarity_days: 60
      entity_context_days: 180
      claim_history_days: 365
      followup_window_days: 90


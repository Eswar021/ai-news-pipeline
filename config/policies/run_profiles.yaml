        - youtube_podcast_transcripts
        - github_open_source_signals
        - community_signals
      query_theme_set: deep_dive
      minimum_expected_documents: 20
      maximum_expected_documents: 500
    collection_windows:
      default:
        mode: inherit_base
      overrides:
        research_papers:
          lookback_days: 30
        youtube_podcast_transcripts:
          lookback_days: 21
        github_open_source_signals:
          lookback_days: 14
        community_signals:

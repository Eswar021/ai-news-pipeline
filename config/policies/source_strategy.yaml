# Source Strategy
# Registry-oriented source-group metadata used by Layer 0 planners.
#
# This file defines:
# - source groups and their member source IDs
# - group-level trust/role metadata
# - reusable query theme sets
#
# It does NOT define per-run collection windows or per-run format routing policy.
# Those belong in policies/run_profiles.yaml.

source_groups:
  ai_company_blogs:
    description: "Official AI company announcements and research blogs (Tier 1)"
    trust_tier: 1
    role: primary_evidence
    source_ids:
      - openai_news
      - anthropic_news
      - anthropic_engineering
      - google_deepmind_blog
      - google_research_blog
      - meta_ai_blog
      - microsoft_ai_news
      - aws_ml_blog
      - nvidia_blog
      - huggingface_blog

  research_papers:
    description: "Academic research papers from arXiv (Tier 1.5)"
    trust_tier: 1.5
    role: research_evidence
    source_ids:
      - arxiv_cs_ai
      - arxiv_cs_lg
      - arxiv_cs_cl
      - arxiv_cs_cv

  tech_news_apis:
    description: "Technology news aggregators and APIs (Tier 2)"
    trust_tier: 2
    role: secondary_evidence
    source_ids:
      - newsapi_ai
      - newsdata_ai
      - mediastack_ai

  youtube_podcast_transcripts:
    description: "AI YouTube channels and podcast transcripts (Tier 2)"
    trust_tier: 2
    role: secondary_evidence
    source_ids:
      - youtube_ai_channels

  community_signals:
    description: "Community discussion signals — trend indicator only, not factual proof (Tier 3)"
    trust_tier: 3
    role: trend_signal_only
    source_ids:
      - hackernews_ai
      - reddit_ai

  github_open_source_signals:
    description: "GitHub trending and open source activity signals (Tier 3)"
    trust_tier: 3
    role: trend_signal_only
    source_ids:
      - github_trending_ai


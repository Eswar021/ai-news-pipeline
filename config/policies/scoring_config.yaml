# Scoring Config — weights used by Layer 3 (story ranker) and Layer 5 (editorial scorer).
# Adjust these weights to tune which stories get prioritized.

story_ranking:
  weights:
    authority: 25       # source trust tier score
    coverage: 15        # number of independent sources
    audience: 12        # audience fit and engagement signal
    impact: 10          # who is affected and how broadly
    evidence: 16        # evidence density and quality
    recency: 10         # how fresh within the collection window
    novelty: 8          # how new vs. previously covered
    engagement: 4       # HN/Reddit/GitHub community signal

  bonuses:
    official_source_present: 10
    research_paper_linked: 8
    multi_source_corroboration: 5

  penalties:
    community_signals_only: -30
    no_primary_source: -20
    partial_content_only: -10
    previously_covered_exact: -25
    low_evidence_density: -15

evidence_scoring:
  min_verified_claims_for_safe: 3
  min_primary_source_for_deep_dive: 1
  community_signal_max_ratio: 0.4  # community cannot be more than 40% of sources

editorial_scoring:
  audience_fit_weight: 0.30
  evidence_safety_weight: 0.25
  novelty_weight: 0.25
  video_opportunity_weight: 0.20

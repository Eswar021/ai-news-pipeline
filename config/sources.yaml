# ──────────────────────────────────────────────
# Source Registry
# Every source the extraction layer collects from
# ──────────────────────────────────────────────

sources:

  # ── AI Company Blogs (Tier 1) ──────────────
  - id: openai_news
    name: OpenAI News
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://openai.com/news/rss/"
    trust_tier: 1
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: anthropic_news
    name: Anthropic News
    module: blog_collector
    extraction_type: html
    url: "https://www.anthropic.com/news"
    trust_tier: 1
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: anthropic_engineering
    name: Anthropic Engineering
    module: blog_collector
    extraction_type: html
    url: "https://www.anthropic.com/engineering"
    trust_tier: 1
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: google_deepmind_blog
    name: Google DeepMind Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://deepmind.google/blog/"
    trust_tier: 1
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: google_research_blog
    name: Google Research Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://research.google/blog/"
    trust_tier: 1
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: meta_ai_blog
    name: Meta AI Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://ai.meta.com/blog/"
    trust_tier: 1
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: microsoft_ai_news
    name: Microsoft AI News
    module: blog_collector
    extraction_type: html
    url: "https://microsoft.ai/news/"
    trust_tier: 1
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: aws_ml_blog
    name: AWS Machine Learning Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://aws.amazon.com/blogs/machine-learning/"
    trust_tier: 1
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: nvidia_blog
    name: NVIDIA Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://blogs.nvidia.com/"
    trust_tier: 1
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: huggingface_blog
    name: Hugging Face Blog
    module: blog_collector
    extraction_type: rss_or_html
    url: "https://huggingface.co/blog"
    trust_tier: 1
    fetch_frequency: daily
    priority: medium
    enabled: true


  # ── Research Papers (Tier 1.5) ─────────────
  - id: arxiv_cs_ai
    name: "arXiv cs.AI"
    module: arxiv_collector
    extraction_type: api
    categories: ["cs.AI"]
    trust_tier: 1.5
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: arxiv_cs_lg
    name: "arXiv cs.LG"
    module: arxiv_collector
    extraction_type: api
    categories: ["cs.LG"]
    trust_tier: 1.5
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: arxiv_cs_cl
    name: "arXiv cs.CL"
    module: arxiv_collector
    extraction_type: api
    categories: ["cs.CL"]
    trust_tier: 1.5
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: arxiv_cs_cv
    name: "arXiv cs.CV"
    module: arxiv_collector
    extraction_type: api
    categories: ["cs.CV"]
    trust_tier: 1.5
    fetch_frequency: daily
    priority: medium
    enabled: true


  # ── Tech News APIs (Tier 2) ────────────────
  - id: newsapi_ai
    name: NewsAPI AI Search
    module: newsapi_collector
    extraction_type: api
    env_key: NewsAPI
    trust_tier: 2
    fetch_frequency: daily
    priority: high
    enabled: true

  - id: newsdata_ai
    name: Newsdata.io AI Search
    module: newsdata_collector
    extraction_type: api
    env_key: NEWSDATA_API
    trust_tier: 2
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: mediastack_ai
    name: Mediastack AI Search
    module: mediastack_collector
    extraction_type: api
    env_key: MEDIASTACK_API
    trust_tier: 2
    fetch_frequency: daily
    priority: medium
    enabled: true


  # ── Community Signals (Tier 3) ─────────────
  - id: hackernews_ai
    name: Hacker News AI Signal
    module: hackernews_collector
    extraction_type: api
    trust_tier: 3
    fetch_frequency: daily
    priority: medium
    enabled: true

  - id: github_trending_ai
    name: GitHub Trending AI
    module: github_collector
    extraction_type: api
    env_key: GITHUB_TOKEN
    trust_tier: 3
    fetch_frequency: daily
    priority: medium
    enabled: false  # enable after getting GITHUB_TOKEN

  - id: reddit_ai
    name: Reddit AI Communities
    module: reddit_collector
    extraction_type: api
    env_key: REDDIT_CLIENT_ID
    trust_tier: 3
    fetch_frequency: daily
    priority: low
    enabled: false  # enable after getting Reddit app credentials


  # ── YouTube (Tier varies) ──────────────────
  - id: youtube_ai_channels
    name: YouTube AI Channels
    module: youtube_collector
    extraction_type: api
    env_key: YOUTUBE_API_KEY
    trust_tier: 2
    fetch_frequency: daily
    priority: medium
    enabled: true

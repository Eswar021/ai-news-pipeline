# ──────────────────────────────────────────────────────────────────────────────
# YouTube Channel Registry
# Used as the YouTube channel registry.
# Layer 0 run profiles decide:
# - collection windows
# - fetch caps / max videos per duration bucket
# - per-run channel overrides
# ──────────────────────────────────────────────────────────────────────────────
#
# Per channel:
#   channel_id:         YouTube channel ID (UCxxxxxxxx)
#   name:               Human-readable name (used in filenames and documents)
#   search_query:       Optional keyword filter within the channel.
#                       Leave null for dedicated AI channels where all content is relevant.
#                       Use a filter for general tech channels that post non-AI content too.
#   enabled:            Set false to skip without deleting

youtube:
  channels:


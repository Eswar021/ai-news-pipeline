# Source Strategy — maps source groups to source IDs and format requirements.
# Read by Layer 0 (source_scope_planner.py).
# Source group names here must match trust_tier groups in sources.yaml.

source_groups:
  ai_company_blogs:
    description: "Official AI company announcements and research blogs (Tier 1)"
    trust_tier: 1
    role: primary_evidence
    source_ids:
      - openai_news
      - anthropic_news
      - anthropic_engineering
      - google_deepmind_blog
      - google_research_blog
      - meta_ai_blog
      - microsoft_ai_news
      - aws_ml_blog
      - nvidia_blog
      - huggingface_blog

  research_papers:
    description: "Academic research papers from arXiv (Tier 1.5)"
    trust_tier: 1.5
    role: research_evidence
    source_ids:
      - arxiv_cs_ai
      - arxiv_cs_lg
      - arxiv_cs_cl
      - arxiv_cs_cv

  tech_news_apis:
    description: "Technology news aggregators and APIs (Tier 2)"
    trust_tier: 2
    role: secondary_evidence
    source_ids:
      - newsapi_ai
      - newsdata_ai
      - mediastack_ai

  youtube_podcast_transcripts:
    description: "AI YouTube channels and podcast transcripts (Tier 2)"
    trust_tier: 2
    role: secondary_evidence
    source_ids:
      - youtube_ai_channels

  community_signals:
    description: "Community discussion signals — trend indicator only, not factual proof (Tier 3)"
    trust_tier: 3
    role: trend_signal_only
    source_ids:
      - hackernews_ai
      - reddit_ai

  github_open_source_signals:
    description: "GitHub trending and open source activity signals (Tier 3)"
    trust_tier: 3
    role: trend_signal_only
    source_ids:
      - github_trending_ai

# Per-format source group requirements.
# required_groups: must have at least one enabled source to proceed.
# optional_groups: collected if enabled, but run is not blocked without them.
# priority_order: determines collection and analysis priority in Layer 1.
format_source_requirements:
  roundup:
    required_groups:
      - ai_company_blogs
      - tech_news_apis
    optional_groups:
      - research_papers
      - community_signals
      - github_open_source_signals
      - youtube_podcast_transcripts
    priority_order:
      - ai_company_blogs
      - tech_news_apis
      - research_papers
      - github_open_source_signals
      - community_signals
      - youtube_podcast_transcripts

  deep_dive:
    required_groups:
      - ai_company_blogs
    optional_groups:
      - research_papers
      - tech_news_apis
      - youtube_podcast_transcripts
      - community_signals
      - github_open_source_signals
    priority_order:
      - ai_company_blogs
      - research_papers
      - tech_news_apis
      - youtube_podcast_transcripts
      - community_signals
      - github_open_source_signals

  evergreen:
    required_groups:
      - research_papers
      - ai_company_blogs
    optional_groups:
      - tech_news_apis
      - youtube_podcast_transcripts
      - community_signals
    priority_order:
      - research_papers
      - ai_company_blogs
      - tech_news_apis
      - youtube_podcast_transcripts
      - community_signals

  auto:
    required_groups:
      - ai_company_blogs
      - tech_news_apis
    optional_groups:
      - research_papers
      - community_signals
      - github_open_source_signals
      - youtube_podcast_transcripts
    priority_order:
      - ai_company_blogs
      - tech_news_apis
      - research_papers
      - github_open_source_signals
      - community_signals
      - youtube_podcast_transcripts

# Default query themes passed to Layer 1 collectors.
query_themes:
  default:
    - "AI agents"
    - "LLM releases"
    - "AI coding tools"
    - "open-source AI"
    - "AI regulation"
    - "AI chips"
    - "AI research"
    - "multimodal AI"
    - "AI safety"
    - "foundation models"

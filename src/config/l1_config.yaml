layer_1:
  source_groups:
    ai_company_blogs:
      collector: "company_blogs"
      enabled: true
      request_timeout_seconds: 20
      sources:
        - id: "openai_news"
          name: "OpenAI News"
          enabled: true
          mode: "rss"
          source_type: "official_company_blog"
          trust_tier: 1
          feed_url: "https://openai.com/news/rss/"
        - id: "google_research_blog"
          name: "Google Research Blog"
          enabled: true
          mode: "rss"
          source_type: "official_company_blog"
          trust_tier: 1
          feed_url: "https://research.google/blog/rss/"
        - id: "aws_ml_blog"
          name: "AWS Machine Learning Blog"
          enabled: true
          mode: "rss"
          source_type: "official_company_blog"
          trust_tier: 1
          feed_url: "https://aws.amazon.com/blogs/machine-learning/feed/"
        - id: "huggingface_blog"
          name: "Hugging Face Blog"
          enabled: true
          mode: "rss"
          source_type: "official_company_blog"
          trust_tier: 1
          feed_url: "https://huggingface.co/blog/feed.xml"

    tech_news_apis:
      collector: "tech_news"
      enabled: true
      request_timeout_seconds: 20
      sources:
        - id: "newsapi_ai"
          name: "NewsAPI AI Search"
          enabled: true
          provider: "newsapi"
          source_type: "tech_news_article"
          trust_tier: 2
          env_keys: ["NEWSAPI_API_KEY", "NewsAPI"]
        - id: "newsdata_ai"
          name: "Newsdata AI Search"
          enabled: true
          provider: "newsdata"
          source_type: "tech_news_article"
          trust_tier: 2
          env_keys: ["NEWSDATA_API_KEY", "NEWSDATA_API"]
        - id: "mediastack_ai"
          name: "Mediastack AI Search"
          enabled: true
          provider: "mediastack"
          source_type: "tech_news_article"
          trust_tier: 2
          env_keys: ["MEDIASTACK_API_KEY", "MEDIASTACK_API"]

    research_papers:
      collector: "research_papers"
      enabled: true
      request_timeout_seconds: 30
      categories:
        - id: "arxiv_cs_ai"
          category: "cs.AI"
          enabled: true
        - id: "arxiv_cs_lg"
          category: "cs.LG"
          enabled: true
        - id: "arxiv_cs_cl"
          category: "cs.CL"
          enabled: true
        - id: "arxiv_cs_cv"
          category: "cs.CV"
          enabled: true

    youtube_podcast_transcripts:
      collector: "youtube_transcripts"
      enabled: true
      request_timeout_seconds: 20
      env_keys: ["YOUTUBE_API_KEY"]
      channels:
        - id: "anthropic"
          name: "Anthropic"
          enabled: true
          channel_id: "UCrDwWp7EBBv4NwvScIpBDOA"
          query: null
        - id: "openai"
          name: "OpenAI"
          enabled: true
          channel_id: "UCXZCJLpYjx0bBFo8ct3jxkQ"
          query: null
        - id: "google_deepmind"
          name: "Google DeepMind"
          enabled: true
          channel_id: "UCP7jMXSY2xbc3KCAE0MHQ-A"
          query: null
        - id: "meta_ai"
          name: "Meta AI"
          enabled: true
          channel_id: "UCfTCjs-mn33x0os_Q35B6cg"
          query: null
        - id: "lex_fridman"
          name: "Lex Fridman"

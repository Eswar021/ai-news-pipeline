<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --paper: #f4efe6;
        --ink: #171611;
        --accent: #b64b2d;
        --muted: #69645c;
        --surface: #fffdf8;
        --sans: "Oswald", "Avenir Next Condensed", sans-serif;
        --serif: "EB Garamond", Georgia, serif;
      }
      html, body { margin: 0; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; }
      body { color: var(--ink); background: var(--paper); font-family: var(--sans); }
      #root { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
      .hf-background-layer, .hf-content-layer, .hf-annotation-layer, .hf-typography-layer {
        position: absolute; inset: 0;
      }
      .hf-background-layer { z-index: 0; overflow: hidden; background: var(--paper); }
      .hf-content-layer { z-index: 2; overflow: hidden; }
      .hf-annotation-layer { z-index: 4; pointer-events: none; }
      .hf-typography-layer { z-index: 6; pointer-events: none; }
      .real-video-scene .hf-background-layer { background: transparent; }
      .paper-grid {
        position: absolute; inset: 0; opacity: .42;
        background-image:
          linear-gradient(color-mix(in srgb, var(--ink) 4%, transparent) 2px, transparent 2px),
          linear-gradient(90deg, color-mix(in srgb, var(--ink) 3%, transparent) 2px, transparent 2px);
        background-size: 94px 94px;
      }
      .ambient-disc {
        position: absolute; right: -7%; top: -19%; width: 49%; aspect-ratio: 1; border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 19%, transparent);
        filter: blur(2px);
      }
      .registration-line { position: absolute; left: 5.4%; top: 7%; width: 9%; height: 8px; background: var(--accent); transform-origin: left center; }
      .grain {
        position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: .18;
        background-image: radial-gradient(color-mix(in srgb, var(--ink) 18%, transparent) .75px, transparent .75px);
        background-size: 5px 5px;
      }
      .eyebrow { color: var(--accent); font-size: clamp(22px, 1.35vw, 28px); font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
      .headline { margin: 0; font-family: var(--serif); font-size: clamp(68px, 6.4vw, 126px); line-height: .9; letter-spacing: -.052em; font-weight: 700; text-wrap: balance; }
      .headline.medium { font-size: clamp(54px, 4.8vw, 94px); }
      .headline.compact { font-size: clamp(44px, 3.7vw, 73px); }
      .support { color: var(--muted); font-size: clamp(27px, 2vw, 40px); line-height: 1.14; font-weight: 580; text-wrap: balance; }
      .accent-word { color: var(--accent); }
      .accent-mark { display: inline-block; position: relative; }
      .accent-mark::after { content: ""; position: absolute; left: -.02em; right: -.02em; bottom: -.09em; height: .085em; background: var(--accent); transform-origin: left center; }
      .source-credit { position: absolute; right: 3%; bottom: 3%; padding: 10px 16px; color: var(--surface); background: color-mix(in srgb, var(--ink) 88%, transparent); font-size: clamp(17px, 1vw, 21px); font-weight: 760; letter-spacing: .04em; }

      /* Editorial text remains open on the shared palette background. */
      .editorial-copy { position: absolute; left: 7%; top: 18%; width: 75%; }
      .editorial-copy .headline { margin-top: 34px; }
      .editorial-copy .support { margin-top: 34px; max-width: 78%; }
      .recipe-editorial_punchline .editorial-copy { left: 10%; top: 27%; width: 80%; text-align: center; }
      .recipe-editorial_punchline .headline { font-size: clamp(82px, 8.2vw, 162px); }
      .recipe-editorial_reset .editorial-copy { left: 12%; top: 31%; width: 70%; }
      .recipe-editorial_reset .headline { font-size: clamp(60px, 5.2vw, 102px); }
      .ghost-word { position: absolute; right: 2%; bottom: -3%; max-width: 50%; overflow: hidden; color: color-mix(in srgb, var(--accent) 11%, transparent); font-size: clamp(150px, 16vw, 310px); line-height: .75; font-weight: 850; text-transform: uppercase; white-space: nowrap; }

      /* Real media is the only full-bleed opaque visual surface. */
      .media-frame { position: absolute; inset: 0; overflow: hidden; }
      .media-fill, .root-media { width: 100%; height: 100%; object-fit: cover; }
      .root-media { position: absolute; inset: 0; z-index: 1; }
      .media-shade { position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--ink) 84%, transparent), color-mix(in srgb, var(--ink) 28%, transparent) 60%, transparent); }
      .media-copy { position: absolute; left: 6%; top: 55%; width: 55%; color: #fffaf2; text-shadow: 0 8px 34px rgba(0,0,0,.55); }
      .media-copy .headline { font-size: clamp(54px, 4.7vw, 92px); }
      .annotation-rail { position: absolute; right: 4.5%; top: 17%; bottom: 17%; width: 31%; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
      .annotation { padding: 15px 18px 15px 24px; color: #fffaf2; border-left: 7px solid var(--accent); background: rgba(22,19,15,.58); backdrop-filter: blur(7px); font-size: clamp(23px, 1.5vw, 31px); line-height: 1.08; font-weight: 760; text-shadow: 0 3px 16px rgba(0,0,0,.5); }
      .recipe-full_bleed_image .media-shade, .recipe-full_bleed_video .media-shade { display: none; }
      .recipe-full_bleed_image .media-copy, .recipe-full_bleed_video .media-copy { display: none; }
      .recipe-image_detail_sequence .media-fill, .recipe-video_detail_sequence .root-media { object-position: 64% 45%; }

      /* Browser and source proof use a real opaque page, never a dark dashboard card. */
      .source-heading { position: absolute; left: 5.2%; top: 5.2%; right: 5.2%; display: flex; align-items: flex-start; justify-content: space-between; gap: 42px; }
      .source-heading .headline { max-width: 76%; }
      .browser { position: absolute; left: 4.2%; right: 4.2%; top: 19%; bottom: 5.5%; overflow: hidden; border: 2px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 18px; background: var(--surface); box-shadow: 0 32px 90px color-mix(in srgb, var(--ink) 18%, transparent); }
      .browser-bar { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 22px; color: var(--muted); background: color-mix(in srgb, var(--paper) 84%, #d9ccba); border-bottom: 2px solid color-mix(in srgb, var(--ink) 11%, transparent); font-size: clamp(17px, 1.02vw, 21px); font-weight: 730; }
      .browser-dot { width: 16px; height: 16px; border-radius: 50%; }
      .browser-image { width: 100%; height: calc(100% - 58px); object-fit: cover; object-position: center 20%; transform-origin: center 24%; }
      .source-highlight { position: absolute; left: 8%; right: 8%; bottom: 8%; padding: 22px 30px; color: var(--ink); background: color-mix(in srgb, var(--surface) 96%, transparent); border-bottom: 8px solid var(--accent); box-shadow: 0 18px 52px rgba(38,30,20,.19); font-family: var(--serif); font-size: clamp(25px, 1.8vw, 36px); line-height: 1.08; font-weight: 700; text-align: center; }
      .recipe-source_headline_push .browser-image { object-position: center top; }
      .recipe-source_detail_focus .browser-image { object-position: center 48%; }
      .recipe-evidence_split .browser { right: 43%; }
      .recipe-evidence_split .source-highlight { left: 62%; right: 5%; top: 31%; bottom: auto; text-align: left; border-bottom: 0; border-left: 8px solid var(--accent); background: transparent; box-shadow: none; }
      .recipe-quote_source_focus .source-highlight { left: 18%; right: 18%; }

      /* Identity scenes float on the palette instead of sitting inside cards. */
      .identity-copy { position: absolute; left: 6%; top: 22%; width: 50%; }
      .identity-copy .headline { margin-top: 34px; }
      .identity-mark { position: absolute; right: 7%; top: 22%; width: 32%; height: 54%; display: flex; align-items: center; justify-content: center; }
      .identity-mark img { width: 88%; height: 80%; object-fit: contain; filter: drop-shadow(0 22px 38px color-mix(in srgb, var(--ink) 16%, transparent)); }
      .identity-name { font-family: var(--serif); font-size: clamp(62px, 5.2vw, 104px); line-height: .9; letter-spacing: -.05em; text-align: center; font-weight: 700; }
      .recipe-identity_lockup .identity-copy { top: 31%; }
      .recipe-identity_pair_reveal .identity-mark { right: 4%; width: 39%; }

      /* Explain one relationship with open labels and a moving line, not cards. */
      .explainer { position: absolute; inset: 0; padding: 7% 6.5%; }
      .explainer .headline { max-width: 74%; }
      .flow { position: absolute; left: 7%; right: 7%; top: 47%; display: flex; align-items: center; gap: 2%; }
      .flow-item { flex: 1; min-width: 0; padding: 22px 8px 20px; border-top: 6px solid color-mix(in srgb, var(--accent) 34%, transparent); }
      .flow-item.focus { border-color: var(--accent); }
      .flow-label { font-family: var(--serif); font-size: clamp(37px, 2.9vw, 58px); line-height: .92; font-weight: 700; }
      .flow-detail { margin-top: 16px; color: var(--muted); font-size: clamp(21px, 1.35vw, 28px); line-height: 1.08; font-weight: 650; }
      .connector { flex: 0 0 7%; height: 5px; background: var(--accent); transform-origin: left center; }
      .recipe-concept_contrast .flow { justify-content: center; gap: 8%; }
      .recipe-concept_contrast .flow-item { flex: 0 1 38%; border-top-width: 9px; }

      /* Chapter transitions are one decisive opener, not a generic title slide. */
      .transition-copy { position: absolute; left: 6.5%; right: 6.5%; top: 17%; bottom: 13%; display: flex; flex-direction: column; justify-content: center; }
      .story-number { color: var(--accent); font-size: clamp(27px, 1.7vw, 34px); font-weight: 850; letter-spacing: .18em; text-transform: uppercase; }
      .transition-copy .headline { max-width: 82%; margin-top: 28px; }
      .transition-subtitle { margin-top: 28px; max-width: 67%; color: var(--muted); font-size: clamp(27px, 1.8vw, 37px); line-height: 1.14; font-weight: 620; }
      .transition-number { position: absolute; right: 4%; top: 5%; color: color-mix(in srgb, var(--accent) 12%, transparent); font-family: var(--serif); font-size: clamp(220px, 23vw, 450px); line-height: .8; font-weight: 700; }
      .transition-with-media .transition-copy { color: #fffaf2; text-shadow: 0 8px 34px rgba(0,0,0,.6); }
      .transition-with-media .transition-subtitle { color: rgba(255,250,242,.86); }

      /* Guided source/interface motion. */
      .walkthrough-steps { position: absolute; right: 4.5%; top: 26%; width: 31%; display: flex; flex-direction: column; gap: 18px; }
      .walkthrough-step { display: grid; grid-template-columns: 46px 1fr; gap: 14px; align-items: start; padding: 15px 18px; color: var(--ink); background: color-mix(in srgb, var(--surface) 95%, transparent); border-left: 7px solid var(--accent); box-shadow: 0 16px 40px rgba(35,28,20,.16); font-size: clamp(20px, 1.3vw, 27px); line-height: 1.08; font-weight: 740; }
      .walkthrough-index { color: var(--accent); font-weight: 900; }
      .recipe-guided_scroll .browser-image { transform-origin: center top; }
      .recipe-interface_detail_zoom .browser-image { transform-origin: 68% 55%; }

      /* Documents are tangible paper surfaces over the shared canvas. */
      .documents-heading { position: absolute; left: 6%; top: 13%; width: 36%; }
      .documents-heading .headline { margin-top: 27px; }
      .document-stage { position: absolute; left: 42%; right: 4.5%; top: 16%; bottom: 7%; }
      .document { position: absolute; width: 78%; min-height: 43%; padding: 30px 34px; color: var(--ink); background: var(--surface); border: 2px solid color-mix(in srgb, var(--ink) 18%, transparent); box-shadow: 0 28px 72px rgba(35,28,20,.18); }
      .document img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .document-type { color: var(--accent); font-size: clamp(18px, 1vw, 22px); font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
      .document-title { margin-top: 17px; font-family: var(--serif); font-size: clamp(33px, 2.35vw, 48px); line-height: .93; font-weight: 700; }
      .document-source { margin-top: 17px; color: var(--muted); font-size: clamp(20px, 1.18vw, 25px); font-weight: 700; }
      .document.focus { outline: 7px solid color-mix(in srgb, var(--accent) 76%, transparent); }
      .document-summary { position: absolute; left: 6%; bottom: 9%; width: 31%; padding-left: 24px; border-left: 8px solid var(--accent); color: var(--muted); font-size: clamp(24px, 1.55vw, 32px); line-height: 1.12; font-weight: 710; }

      /* Interface change is an open transformation path, not dashboard chrome. */
      .transform-heading { position: absolute; left: 6.5%; top: 10%; width: 74%; }
      .transform-stage { position: absolute; left: 7%; right: 7%; top: 41%; bottom: 11%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 4%; align-items: center; }
      .transform-side { padding-top: 20px; border-top: 7px solid color-mix(in srgb, var(--accent) 32%, transparent); }
      .transform-side.after { border-color: var(--accent); }
      .transform-label { font-family: var(--serif); font-size: clamp(44px, 3.3vw, 66px); font-weight: 700; }
      .transform-item { margin-top: 16px; color: var(--muted); font-size: clamp(24px, 1.55vw, 32px); font-weight: 680; }
      .transform-arrow { color: var(--accent); font-size: clamp(68px, 5vw, 100px); }
      .transform-note { position: absolute; left: 7%; bottom: 6%; padding-left: 22px; border-left: 7px solid var(--accent); color: var(--muted); font-size: clamp(24px, 1.5vw, 31px); font-weight: 720; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__" data-fps="__FPS__">
      <section id="stage" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1"></section>
    </main>
    <script id="scene-spec" type="application/json">__SCENE_SPEC_JSON__</script>
    <script>
      const spec = JSON.parse(document.querySelector("#scene-spec").textContent);
      const scene = spec.scene || {};
      const payload = scene.payload || {};
      const asset = scene.resolved_asset || {};
      const style = spec.visual_style || {};
      const root = document.querySelector("#root");
      const stage = document.querySelector("#stage");
      const text = (value, fallback = "") => typeof value === "string" && value.trim() ? value.trim() : fallback;
      const list = (value) => Array.isArray(value) ? value.filter((item) => typeof item === "string" && item.trim()).map((item) => item.trim()) : [];
      const objects = (value) => Array.isArray(value) ? value.filter((item) => item && typeof item === "object") : [];
      const create = (tag, className = "", value = "") => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (value) element.textContent = value;
        return element;
      };
      const append = (parent, ...children) => children.filter(Boolean).forEach((child) => parent.appendChild(child));
      const normalizeWord = (value) => text(value).toLocaleLowerCase().replace(/[^\p{L}\p{N}'’-]+/gu, "");
      const accentWords = new Set(list(payload.accent_words).flatMap((value) => value.split(/\s+/)).map(normalizeWord).filter(Boolean));
      const headlineNode = (value, className = "headline hf-enter") => {
        const element = create("h1", className);
        text(value).split(/(\s+)/).forEach((part) => {
          if (!part.trim()) return element.appendChild(document.createTextNode(part));
          if (accentWords.has(normalizeWord(part))) element.appendChild(create("span", "accent-word", part));
          else element.appendChild(document.createTextNode(part));
        });
        return element;
      };
      const eyebrowNode = () => text(payload.eyebrow) ? create("div", "eyebrow hf-enter", text(payload.eyebrow)) : null;
      const assetUrl = text(asset.asset_render_url) || text(asset.asset_data_uri);
      const headline = text(payload.headline) || text(payload.overlay_headline) || text(payload.companion_text) || text(scene.script_excerpt, "Untitled story");
      const support = text(payload.supporting_text) || text(payload.companion_text);
      const sourceLabel = text(payload.source_label) || text(asset.capture && asset.capture.domain) || text(asset.media && asset.media.attribution);
      const recipeId = text(payload.recipe_id);

      root.style.setProperty("--paper", text(style.background_color, "#f4efe6"));
      root.style.setProperty("--ink", text(style.text_color, "#171611"));
      root.style.setProperty("--accent", text(style.accent_color, "#b64b2d"));
      root.style.setProperty("--muted", text(style.muted_color, "#69645c"));
      root.style.setProperty("--surface", text(style.surface_color, "#fffdf8"));
      root.style.setProperty("--sans", text(style.sans_font, 'Oswald, "Avenir Next Condensed", sans-serif'));
      root.style.setProperty("--serif", text(style.editorial_font, '"EB Garamond", Georgia, serif'));
      stage.dataset.recipeId = recipeId;
      stage.classList.add(`recipe-${recipeId}`);

      const backgroundLayer = create("div", "hf-background-layer");
      const contentLayer = create("div", "hf-content-layer");
      const annotationLayer = create("div", "hf-annotation-layer");
      const typographyLayer = create("div", "hf-typography-layer");
      append(backgroundLayer, create("div", "paper-grid"), create("div", "ambient-disc hf-ambient"));
      append(stage, backgroundLayer, contentLayer, annotationLayer, typographyLayer, create("div", "grain"));

      const addRule = () => typographyLayer.appendChild(create("div", "registration-line hf-rule"));
      const addCredit = (label) => label && annotationLayer.appendChild(create("div", "source-credit hf-enter", label));
      const addImage = (parent, className = "media-fill hf-media", url = assetUrl) => {
        if (!url) return null;
        const image = create("img", className);
        image.src = url;
        image.alt = text(asset.alt_text, text(payload.primary_entity, "Story visual"));
        parent.appendChild(image);
        return image;
      };
      const addVideo = () => {
        if (!assetUrl) return null;
        const media = create("video", "root-media hf-media");
        media.src = assetUrl;
        media.muted = true;
        media.preload = "auto";
        media.setAttribute("playsinline", "");
        media.setAttribute("data-start", "0");
        media.setAttribute("data-duration", String(spec.duration_seconds || 6));
        root.insertBefore(media, stage);
        return media;
      };

      const renderEditorial = () => {
        addRule();
        const copy = create("section", "editorial-copy");
        append(copy, eyebrowNode(), headlineNode(headline), support ? create("div", "support hf-enter", support) : null);
        typographyLayer.appendChild(copy);
        const ghost = list(payload.accent_words)[0];
        if (ghost) typographyLayer.appendChild(create("div", "ghost-word hf-ghost", ghost));
      };

      const renderContextMedia = (video) => {
        if (video && assetUrl) stage.classList.add("real-video-scene");
        const frame = create("div", "media-frame hf-media-frame");
        if (video) addVideo(); else addImage(frame);
        if (!video) contentLayer.appendChild(frame);
        contentLayer.appendChild(create("div", "media-shade hf-shade"));
        if (payload.show_overlay === true && headline) {
          const copy = create("section", "media-copy");
          copy.appendChild(headlineNode(headline, "headline medium hf-enter"));
          typographyLayer.appendChild(copy);
        }
        list(payload.annotations).slice(0, 3).forEach((item) => {
          let rail = annotationLayer.querySelector(".annotation-rail");
          if (!rail) { rail = create("div", "annotation-rail"); annotationLayer.appendChild(rail); }
          rail.appendChild(create("div", "annotation hf-annotation", item));
        });
        addCredit(sourceLabel);
      };

      const browserSurface = () => {
        const browser = create("section", "browser hf-browser");
        const bar = create("div", "browser-bar");
        ["#e05e4b", "#dca836", "#5a9c6d"].forEach((color) => {
          const dot = create("span", "browser-dot"); dot.style.background = color; bar.appendChild(dot);
        });
        bar.appendChild(create("span", "", text(payload.url).replace(/^https?:\/\//, "").slice(0, 92)));
        browser.appendChild(bar);
        addImage(browser, "browser-image hf-source-image");
        contentLayer.appendChild(browser);
        return browser;
      };

      const renderSource = (evidence = false) => {
        const heading = create("section", "source-heading");
        heading.appendChild(headlineNode(text(payload.overlay_headline, headline), "headline compact hf-enter"));
        typographyLayer.appendChild(heading);
        browserSurface();
        const proof = evidence ? text(payload.claim_text) || text(payload.supporting_text) || text(payload.target_text) : text(payload.target_text);
        if (proof) annotationLayer.appendChild(create("div", `source-highlight hf-highlight${evidence ? " hf-evidence" : ""}`, proof.slice(0, 210)));
      };

      const renderLogo = () => {
        addRule();
        const copy = create("section", "identity-copy");
        append(copy, eyebrowNode(), headlineNode(support || headline, "headline medium hf-enter"));
        typographyLayer.appendChild(copy);
        const mark = create("div", "identity-mark hf-mark");
        if (assetUrl) addImage(mark, "");
        else mark.appendChild(create("div", "identity-name", text(payload.primary_entity, headline)));
        contentLayer.appendChild(mark);
      };

      const renderExplainer = () => {
        const wrap = create("section", "explainer");
        append(wrap, eyebrowNode(), headlineNode(headline, "headline medium hf-enter"));
        const flow = create("div", "flow");
        const focus = text(payload.focus_item_label).toLowerCase();
        objects(payload.items).slice(0, 4).forEach((item, index) => {
          if (index) flow.appendChild(create("div", "connector hf-connector"));
          const label = text(item.label, `Step ${index + 1}`);
          const block = create("div", `flow-item hf-flow-item${label.toLowerCase() === focus ? " focus" : ""}`);
          append(block, create("div", "flow-label", label), text(item.detail) ? create("div", "flow-detail", text(item.detail)) : null);
          flow.appendChild(block);
        });
        wrap.appendChild(flow);
        contentLayer.appendChild(wrap);
      };

      const renderTransition = () => {
        const withMedia = Boolean(assetUrl);
        if (withMedia) {
          const frame = create("div", "media-frame hf-media-frame");
          if (text(payload.background_media_type) === "video") {
            stage.classList.add("real-video-scene");
            addVideo();
          } else addImage(frame);
          if (text(payload.background_media_type) !== "video") contentLayer.appendChild(frame);
          contentLayer.appendChild(create("div", "media-shade hf-shade"));
          stage.classList.add("transition-with-media");
        } else addRule();
        const copy = create("section", "transition-copy");
        const storyNumber = text(payload.story_number);
        append(
          copy,
          create("div", "story-number hf-enter", storyNumber ? `Story ${storyNumber}` : "Next story"),
          headlineNode(headline, "headline hf-enter"),
          text(payload.subtitle) ? create("div", "transition-subtitle hf-enter", text(payload.subtitle)) : null,
        );
        typographyLayer.appendChild(copy);
        if (storyNumber && !withMedia) typographyLayer.appendChild(create("div", "transition-number hf-ghost", storyNumber));
      };

      const renderWalkthrough = () => {
        const heading = create("section", "source-heading");
        heading.appendChild(headlineNode(headline, "headline compact hf-enter"));
        typographyLayer.appendChild(heading);
        browserSurface();
        const steps = create("div", "walkthrough-steps");
        objects(payload.walkthrough_steps).slice(0, 4).forEach((step, index) => {
          const row = create("div", "walkthrough-step hf-walkthrough-step");
          append(row, create("span", "walkthrough-index", String(index + 1).padStart(2, "0")), create("span", "", [text(step.label), text(step.detail) || text(step.target_text)].filter(Boolean).join(" — ")));
          steps.appendChild(row);
        });
        annotationLayer.appendChild(steps);
      };

      const renderDocuments = () => {
        const heading = create("section", "documents-heading");
        append(heading, eyebrowNode(), headlineNode(headline, "headline compact hf-enter"));
        typographyLayer.appendChild(heading);
        const stack = create("div", "document-stage");
        const nestedAssets = objects(asset.assets);
        const documents = objects(payload.documents).slice(0, 5);
        const focus = text(payload.focus_document_label).toLowerCase();
        documents.forEach((doc, index) => {
          const isFocus = text(doc.title).toLowerCase() === focus || (!focus && index === 0);
          const sheet = create("article", `document hf-document${isFocus ? " focus hf-focus" : ""}`);
          sheet.style.left = `${index * 7}%`;
          sheet.style.top = `${index * 8}%`;
          sheet.style.transform = `rotate(${(index - 1) * 2.1}deg)`;
          sheet.style.zIndex = isFocus ? "9" : String(index + 1);
          const resolved = nestedAssets.find((item) => text(item.asset_id) === text(doc.asset_id)) || nestedAssets[index];
          const resolvedUrl = resolved ? text(resolved.asset_render_url) || text(resolved.asset_data_uri) : "";
          if (resolvedUrl) addImage(sheet, "", resolvedUrl);
          else append(sheet, create("div", "document-type", text(doc.document_type, "SOURCE")), create("div", "document-title", text(doc.title)), create("div", "document-source", [text(doc.source), text(doc.date)].filter(Boolean).join(" · ")));
          stack.appendChild(sheet);
        });
        contentLayer.appendChild(stack);
        if (text(payload.stack_summary)) annotationLayer.appendChild(create("div", "document-summary hf-enter", text(payload.stack_summary)));
      };

      const renderTransform = () => {
        const heading = create("section", "transform-heading");
        heading.appendChild(headlineNode(headline, "headline medium hf-enter"));
        typographyLayer.appendChild(heading);
        const path = create("div", "transform-stage");
        [payload.before || {}, payload.after || {}].forEach((panel, index) => {
          if (index) path.appendChild(create("div", "transform-arrow hf-arrow", "→"));
          const side = create("section", `transform-side hf-transform${index ? " after hf-focus" : ""}`);
          side.appendChild(create("div", "transform-label", text(panel.label, index ? "After" : "Before")));
          list(panel.items).slice(0, 5).forEach((item) => side.appendChild(create("div", "transform-item", item)));
          path.appendChild(side);
        });
        contentLayer.appendChild(path);
        if (text(payload.transformation_label)) annotationLayer.appendChild(create("div", "transform-note hf-enter", text(payload.transformation_label)));
      };

      const recipeRenderers = {
        editorial_hook: renderEditorial,
        editorial_punchline: renderEditorial,
        editorial_reset: renderEditorial,
        chapter_opener: renderTransition,
        chapter_media_opener: renderTransition,
        chapter_identity_opener: renderTransition,
        source_proof_scan: () => renderSource(false),
        source_headline_push: () => renderSource(false),
        source_detail_focus: () => renderSource(false),
        layered_evidence_reveal: () => renderSource(true),
        evidence_split: () => renderSource(true),
        quote_source_focus: () => renderSource(true),
        annotated_image_focus: () => renderContextMedia(false),
        full_bleed_image: () => renderContextMedia(false),
        image_detail_sequence: () => renderContextMedia(false),
        annotated_video_focus: () => renderContextMedia(true),
        full_bleed_video: () => renderContextMedia(true),
        video_detail_sequence: () => renderContextMedia(true),
        identity_reveal: renderLogo,
        identity_lockup: renderLogo,
        identity_pair_reveal: renderLogo,
        mechanism_steps: renderExplainer,
        causal_chain: renderExplainer,
        concept_contrast: renderExplainer,
        interface_walkthrough: renderWalkthrough,
        guided_scroll: renderWalkthrough,
        interface_detail_zoom: renderWalkthrough,
        evidence_stack: renderDocuments,
        source_proof_montage: renderDocuments,
        focal_document: renderDocuments,
        interface_before_after: renderTransform,
        workflow_morph: renderTransform,
        interface_focus_shift: renderTransform,
      };
      if (!recipeId || !recipeRenderers[recipeId]) throw new Error(`Unsupported or missing HyperFrames recipe_id: ${recipeId || "<empty>"}`);
      recipeRenderers[recipeId]();

      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      const sceneDuration = Math.max(2, Number(spec.duration_seconds || 6));
      const focusMoment = Math.max(1.1, Math.min(sceneDuration * .42, sceneDuration - .8));
      const animate = (selector, from, to, at) => {
        const targets = stage.querySelectorAll(selector);
        if (targets.length) timeline.fromTo(targets, from, to, at);
      };
      animate(".hf-ambient", { scale: .92, x: 0 }, { scale: 1.08, x: -24, duration: sceneDuration, ease: "sine.inOut" }, 0);
      animate(".hf-rule", { scaleX: 0 }, { scaleX: 1, duration: .52, ease: "power3.out" }, .08);
      animate(".hf-enter", { y: 52, opacity: 0 }, { y: 0, opacity: 1, duration: .72, stagger: .12, ease: "power3.out" }, .16);
      animate(".hf-ghost", { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 1.05, ease: "power3.out" }, .3);
      animate(".hf-media-frame", { opacity: .15 }, { opacity: 1, duration: .78, ease: "power2.out" }, 0);
      animate(".hf-media", { scale: 1.065 }, { scale: 1, duration: sceneDuration, ease: "none" }, 0);
      animate(".hf-browser", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: .75, ease: "power3.out" }, .3);
      animate(".hf-source-image", { scale: 1.035 }, { scale: 1.11, y: -22, duration: sceneDuration, ease: "none" }, 0);
      animate(".hf-highlight", { clipPath: "inset(0 100% 0 0)", opacity: 0 }, { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: .72, ease: "power3.out" }, focusMoment);
      animate(".hf-annotation", { x: 58, opacity: 0 }, { x: 0, opacity: 1, duration: .52, stagger: .34, ease: "power3.out" }, focusMoment);
      animate(".hf-mark", { scale: .62, opacity: 0, rotate: -5 }, { scale: 1, opacity: 1, rotate: 0, duration: .8, ease: "back.out(1.4)" }, .52);
      animate(".hf-flow-item", { y: 42, opacity: 0 }, { y: 0, opacity: 1, duration: .56, stagger: .2, ease: "power3.out" }, .76);
      animate(".hf-connector", { scaleX: 0 }, { scaleX: 1, duration: .42, stagger: .2, ease: "power2.out" }, .96);
      animate(".hf-walkthrough-step", { x: 58, opacity: 0 }, { x: 0, opacity: 1, duration: .48, stagger: .34, ease: "power3.out" }, focusMoment);
      animate(".hf-document", { y: 92, rotate: -6, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: .66, stagger: .2, ease: "power3.out" }, .58);
      animate(".hf-transform", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: .62, stagger: .32, ease: "power3.out" }, .78);
      animate(".hf-arrow", { scale: .45, opacity: 0 }, { scale: 1, opacity: 1, duration: .48, ease: "back.out(1.35)" }, focusMoment - .2);
      animate(".hf-focus", { scale: .96 }, { scale: 1, duration: .52, ease: "power2.out" }, focusMoment);
      window.__timelines.main = timeline;
    </script>
  </body>
</html>

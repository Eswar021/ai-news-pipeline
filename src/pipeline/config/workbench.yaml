experiments:
  voiceover_delivery_comparison:
    section_type: intro
    beat_count: 1
    max_projected_cost_usd: 2.0
    provider_request_intervals_seconds:
      gemini: 2.0
    default_variant_ids:
    - marin_dynamic_creator
    - marin_warm_witty
    - cedar_punchy_explainer
    - coral_bright_storyteller
    variants:
    - id: marin_dynamic_creator
      label: Marin - Dynamic Creator
      description: Controlled surprise, contrast, and forward momentum for a roundup opening.
      config:
        provider: openai
        style: general_youtube
        speed: 0.98
        openai:
          voice: marin
          instructions: Perform this as an expressive YouTube technology-news opening, not as a newsreader. Begin
            with controlled disbelief at the first number, sharpen the contrast in the second sentence, then build
            curiosity toward the final line. Use meaningful pitch and pace changes, stress the key numbers and the
            words confidence and evidence, and leave a brief pause before the final reveal.
    - id: marin_warm_witty
      label: Marin - Warm and Witty
      description: More conversational personality with a lightly amused edge.
      config:
        provider: openai
        style: general_youtube
        speed: 0.96
        openai:
          voice: marin
          instructions: Speak like a smart technology creator sharing an eyebrow-raising discovery with one viewer.
            Sound warm, curious, and lightly amused by the mismatch between confidence and evidence. Vary rhythm
            naturally, give the numbers room to land, and finish with quiet intrigue rather than announcer-style
            intensity.
    - id: cedar_punchy_explainer
      label: Cedar - Punchy Explainer
      description: Crisp, confident delivery with stronger contrast and less theatricality.
      config:
        provider: openai
        style: general_youtube
        speed: 1.01
        openai:
          voice: cedar
          instructions: Deliver this like a sharp, modern YouTube explainer. Keep the first two figures crisp and
            distinct, accelerate slightly through the setup, then slow down and emphasize the contrast between confidence
            and evidence. Sound confident and energized, with natural pitch variation, but never like a television
            anchor or advertisement.
    - id: coral_bright_storyteller
      label: Coral - Bright Storyteller
      description: Brighter personality and visible curiosity without exaggerated hype.
      config:
        provider: openai
        style: general_youtube
        speed: 0.99
        openai:
          voice: coral
          instructions: Tell this opening with bright curiosity and an expressive creator voice. Treat each number
            as a surprising clue, use a quick reset between the first two sentences, and make the final contrast
            feel like the reason the viewer should keep watching. Keep it human, lively, and conversational without
            shouting or sounding promotional.
    - id: gemini31_kore_director
      label: Gemini 3.1 Kore - Directed and Firm
      description: Controlled authority with explicit reveal and contrast direction.
      config:
        provider: gemini
        style: general_youtube
        speed: 0.98
        gemini:
          model: gemini-3.1-flash-tts-preview
          voice: Kore
          worker_count: 1
          instructions: 'Audio profile: an incisive but personable technology creator. Scene: opening a tightly
            edited YouTube roundup with two figures that sound impressive until the evidence catches up. Director''s
            notes: begin with measured surprise, articulate both numbers cleanly, pause briefly after each contrast,
            then lower the pace and add intrigue on the final sentence. Avoid broadcast-news cadence, sales energy,
            and melodrama.'
    - id: gemini31_achird_friendly
      label: Gemini 3.1 Achird - Friendly Creator
      description: Direct-to-viewer warmth, curiosity, and conversational rhythm.
      config:
        provider: gemini
        style: general_youtube
        speed: 0.97
        gemini:
          model: gemini-3.1-flash-tts-preview
          voice: Achird
          worker_count: 1
          instructions: 'Audio profile: a smart, friendly YouTube technology host speaking to one curious viewer.
            Scene: the host has just noticed that the confidence in this week''s AI headlines arrived before the
            proof. Director''s notes: sound genuinely intrigued, let the two numbers land without rushing, use a
            lightly amused turn on confidence, and finish evidence is the interesting part as an inviting reveal.
            Keep the performance natural and unscripted rather than announcer-like.'
    - id: gemini31_sadachbia_lively
      label: Gemini 3.1 Sadachbia - Lively Hook
      description: Higher energy and sharper momentum while preserving clarity.
      config:
        provider: gemini
        style: general_youtube
        speed: 1.0
        gemini:
          model: gemini-3.1-flash-tts-preview
          voice: Sadachbia
          worker_count: 1
          instructions: 'Audio profile: a lively, quick-thinking technology creator with strong control of emphasis.
            Scene: a cold open designed to stop a viewer without shouting. Director''s notes: hit the first figure
            with surprise, reset before the security rating, build momentum through the contradiction, and make
            the final clause feel like a promise that the real story is about to begin. Use expressive pitch and
            tempo changes while keeping every number easy to understand.'

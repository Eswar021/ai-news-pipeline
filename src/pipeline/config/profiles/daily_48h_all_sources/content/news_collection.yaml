profile:
  description: Strict 48-hour collection run across all enabled source groups.
  lookback_hours: 48
  enabled_source_groups:
  - ai_company_blogs
  - tech_news_apis
  - research_papers
  - youtube_podcast_transcripts
  - community_signals
  query_themes:
  - AI agents
  - LLM releases
  - AI coding tools
  - AI research
  - AI product launches
  collector_caps:
    ai_company_blogs:
      max_items_per_source: 4
    tech_news_apis:
      max_items_per_source: 10
    research_papers:
      max_items_per_category: 10
    youtube_podcast_transcripts:
      max_videos_per_channel: 3
    community_signals:
      max_items: 20
      scan_depth: 100
source_groups:
  ai_company_blogs:
    collector: company_blogs
    enabled: true
    request_timeout_seconds: 20
    sources:
    - id: openai_news
      name: OpenAI News
      enabled: true
      mode: rss
      source_type: official_company_blog
      trust_tier: 1
      feed_url: https://openai.com/news/rss.xml
    - id: anthropic_news
      name: Anthropic News
      enabled: true
      mode: anthropic_listing
      source_type: official_company_blog
      trust_tier: 1
      listing_url: https://www.anthropic.com/news
      base_url: https://www.anthropic.com
      allowed_path_prefixes:
      - /news/
      - /research/
      - /index/
    - id: anthropic_engineering
      name: Anthropic Engineering
      enabled: true
      mode: anthropic_listing
      source_type: official_company_blog
      trust_tier: 1
      listing_url: https://www.anthropic.com/engineering
      base_url: https://www.anthropic.com
      allowed_path_prefixes:
      - /engineering/
      - /news/
      - /research/
      - /index/
    - id: google_research_blog
      name: Google Research Blog
      enabled: true
      mode: rss
      source_type: official_company_blog
      trust_tier: 1
      feed_url: https://research.google/blog/rss/
    - id: google_deepmind_blog
      name: Google DeepMind Blog
      enabled: true
      mode: generic_listing
      source_type: official_company_blog
      trust_tier: 1
      listing_url: https://deepmind.google/blog/
      base_url: https://deepmind.google
      allowed_path_prefixes:
      - /blog/
      - /en/blog/
    - id: antigravity_blog
      name: Google Antigravity Blog
      enabled: true
      mode: spa_bundle_listing
      source_type: official_company_blog
      trust_tier: 1
      listing_url: https://www.antigravity.google/blog
      base_url: https://www.antigravity.google
      allowed_path_prefixes:
      - /blog/
    - id: google_ai_blog
      name: Google AI Blog
      enabled: true
      mode: rss
      source_type: official_company_blog
      trust_tier: 1
      feed_url: https://blog.google/innovation-and-ai/technology/ai/rss/
    - id: google_developer_tools_blog
      name: Google Developer Tools Blog
      enabled: true
      mode: rss
      source_type: official_company_blog
      trust_tier: 1

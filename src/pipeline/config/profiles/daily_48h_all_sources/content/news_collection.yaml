      trust_tier: 1
      listing_url: https://microsoft.ai/news/
      base_url: https://microsoft.ai
      allowed_path_prefixes:
      - /news/
    - id: aws_ml_blog
      name: AWS Machine Learning Blog
      enabled: true
      mode: rss
      source_type: official_company_blog
      trust_tier: 1
      feed_url: https://aws.amazon.com/blogs/machine-learning/feed/
    - id: nvidia_blog
      name: NVIDIA Blog
      enabled: true
      mode: generic_listing
      source_type: official_company_blog
      trust_tier: 1
      listing_url: https://blogs.nvidia.com/

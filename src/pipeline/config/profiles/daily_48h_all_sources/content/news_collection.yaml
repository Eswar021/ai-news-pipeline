      name: Hacker News AI
      enabled: true
      provider: hackernews
      source_type: community_signal
      trust_tier: 3
      story_type: top
    - id: github_trending_ai
      name: GitHub Trending AI
      enabled: true
      provider: github
      source_type: community_signal
      trust_tier: 3
      env_keys:
      - GITHUB_TOKEN
      max_items: 10
      search_queries:
      - hermes agent
      - openclaw
      - ai agent
      - agent framework

      trust_tier: 1
      feed_url: https://developer.nvidia.com/blog/feed/
  tech_news_apis:
    collector: tech_news
    enabled: true
    request_timeout_seconds: 20
    sources:
    - id: newsapi_ai
      name: NewsAPI AI Search
      enabled: true
      provider: newsapi
      source_type: tech_news_article
      trust_tier: 2
      env_keys:
      - NEWSAPI_API_KEY
      - NewsAPI
    - id: newsdata_ai
      name: Newsdata AI Search
      enabled: true
      provider: newsdata
      source_type: tech_news_article
      trust_tier: 2
      env_keys:
      - NEWSDATA_API_KEY
      - NEWSDATA_API
    - id: mediastack_ai
      name: Mediastack AI Search
      enabled: true
      provider: mediastack
      source_type: tech_news_article
      trust_tier: 2
      env_keys:
      - MEDIASTACK_API_KEY
      - MEDIASTACK_API
    - id: techcrunch_ai
      name: TechCrunch AI
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://techcrunch.com/category/artificial-intelligence/feed/
    - id: the_verge_ai
      name: The Verge
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://www.theverge.com/rss/index.xml
    - id: venturebeat_ai
      name: VentureBeat AI
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://venturebeat.com/category/ai/feed/
    - id: mit_technology_review_ai
      name: MIT Technology Review
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://www.technologyreview.com/feed/
    - id: latent_space
      name: Latent Space
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://www.latent.space/feed
    - id: import_ai
      name: Import AI
      enabled: true
      provider: rss_feed
      source_type: tech_news_article
      trust_tier: 2
      source_relationship: third_party
      feed_url: https://jack-clark.net/feed/
  research_papers:
    collector: research_papers
    enabled: true
    request_timeout_seconds: 30
    categories:
    - id: arxiv_cs_ai
      category: cs.AI
      enabled: true
    - id: arxiv_cs_lg
      category: cs.LG
      enabled: false
    - id: arxiv_cs_cl
      category: cs.CL
      enabled: false
    - id: arxiv_cs_cv
      category: cs.CV
      enabled: false
  youtube_podcast_transcripts:
    collector: youtube_transcripts
    enabled: true
    request_timeout_seconds: 20
    env_keys:
    - YOUTUBE_API_KEY
    channels:
    - id: anthropic
      name: Anthropic

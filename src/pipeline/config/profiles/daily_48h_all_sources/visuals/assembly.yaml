force: true
output_dir: ''
ffmpeg_path: ffmpeg
ffprobe_path: ffprobe
final_video_filename: final_video.mp4
video_codec: libx264
normalize_scene_boundaries: true
audio_codec: aac
audio_bitrate: 192k
audio_sample_rate_hz: 48000
audio_channels: 2
shortest: true
movflags_faststart: true
allow_reencode_fallback: true
reencode_video_codec: libx264
reencode_preset: veryfast
reencode_crf: 18
pixel_format: yuv420p
duration_tolerance_seconds: 2.0

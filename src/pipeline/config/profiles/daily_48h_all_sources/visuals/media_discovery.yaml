force: true
output_dir: ''
user_agent: AIContentCreation/2.0 (visual-media-discovery)
request_timeout_seconds: 25
download_timeout_seconds: 90
max_download_bytes: 250000000
ffmpeg_path: ffmpeg
ffprobe_path: ffprobe
video_output_width: 1280
video_clip_padding_seconds: 0.75
max_queries_per_scene: 3
max_candidates_per_query: 8
candidate_catalog_limit_per_scene: 12
min_image_width: 1280
min_image_height: 720
preferred_aspect_ratio: 1.7777777778
trusted_catalog_only: true
allow_query_fallback: false
reuse_equivalent_image_requests: true
max_fallback_requests: 0
unresolved_fallback_render_kind: null
semantic_verification:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  prompt_version: v1
  temperature: 0.0
  max_candidates_per_scene: 4
  max_attempts: 2
  verify_video_clip_frames: true
  max_video_sample_frames: 5
  video_clip_failure_policy: reject
providers:
  wikimedia:
    enabled: true
    endpoint: https://commons.wikimedia.org/w/api.php
    include_images: true
    include_videos: false
  pexels:
    enabled: false
    api_key_env: PEXELS_API_KEY
    photo_endpoint: https://api.pexels.com/v1/search
    video_endpoint: https://api.pexels.com/videos/search
  pixabay:
    enabled: false
    api_key_env: PIXABAY_API_KEY
    photo_endpoint: https://pixabay.com/api/
    video_endpoint: https://pixabay.com/api/videos/

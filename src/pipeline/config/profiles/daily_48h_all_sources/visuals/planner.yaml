provider: openai
model: gpt-4o-mini
prompt_version: v1
temperature: 0.3
provider_options:
  request_timeout_seconds: 300
structured_output:
  method: json_schema
  strict: true
llm_roles:
  episode_director:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.3
    provider_options:
      request_timeout_seconds: 300
    structured_output:
      method: json_schema
      strict: true
  bookend_visual_planner:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.3
    provider_options:
      request_timeout_seconds: 300
    structured_output:
      method: json_schema
      strict: true
  story_visual_planner:
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 1.0
    max_attempts: 2
    provider_options:
      thinking: enabled
      omit_temperature: true
      reasoning_effort: max
      request_timeout_seconds: 600
    structured_output:
      method: json_mode
      strict: false
    content_filter_fallback:
      provider: openai
      model: gpt-4o
      temperature: 0.4
      max_attempts: 2
      provider_options:
        request_timeout_seconds: 300
      structured_output:
        method: json_schema
        strict: true
  story_visual_editor:
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 1.0
    max_attempts: 2
    provider_options:
      thinking: enabled
      omit_temperature: true
      reasoning_effort: max
      request_timeout_seconds: 600
    structured_output:
      method: json_mode
      strict: false
    content_filter_fallback:
      provider: openai
      model: gpt-4o
      temperature: 0.4
      max_attempts: 2
      provider_options:
        request_timeout_seconds: 300
      structured_output:
        method: json_schema
        strict: true
max_attempts: 3
diagnostic_words_per_minute: 150
allow_deterministic_story_fallbacks: false
require_asset_catalog: true
require_visual_research: true
require_real_anchor_per_story: true
real_anchor_failure_mode: warn
max_automatic_timing_repair_seconds: 0.5
style:
  style_id: editorial_minimal
  visual_language: asset-first editorial YouTube visuals with clean typography and generous whitespace
  motion_style: restrained editorial reveals, purposeful source zooms, subtle parallax, and short chapter wipes
  color_system: warm paper, near-black ink, and one restrained burnt-orange accent
  typography: expressive editorial serif headlines with condensed uppercase sans labels
  background_color: '#f4efe6'
  text_color: '#171611'
  accent_color: '#b64b2d'
  muted_color: '#69645c'
  editorial_font: EB Garamond
  sans_font: Oswald
  surface_treatment: one palette-owned background with transparent content and annotation layers
  card_policy: no decorative cards; opaque surfaces are reserved for real browser, document, image, video, or interface media
  avoid:
  - PPT-style cards
  - dark dashboard panels
  - decorative pills and chrome
  - static slide-deck layouts
  - walls of text
  - tiny explanatory labels
  - decorative charts without source-supported data
visual_mix_policy:
  target_max_text_like_scene_ratio: 0.3
  target_max_text_like_duration_ratio: 0.3
  target_max_text_like_scenes_per_story: 2
  prefer_catalog_assets_for_concrete_subjects: true
  prefer_explanatory_motion_for_mechanisms: true
  kinetic_text_is_supporting_only: true
  review_text_scenes_with_candidate_media: true
recipe_policy:
  enabled: true
  require_recipe_id: true
  required_backend_support:
  - remotion
  - hyperframes
  allowed_recipe_ids:
  - editorial_hook
  - editorial_punchline
  - editorial_reset
  - chapter_opener
  - chapter_media_opener
  - chapter_identity_opener
  - source_proof_scan
  - source_headline_push
  - source_detail_focus
  - layered_evidence_reveal
  - evidence_split
  - quote_source_focus
  - annotated_image_focus
  - full_bleed_image
  - image_detail_sequence
  - annotated_video_focus
  - full_bleed_video
  - video_detail_sequence
  - identity_reveal
  - identity_lockup
  - identity_pair_reveal
  - mechanism_steps
  - causal_chain
  - concept_contrast
  - interface_walkthrough
  - guided_scroll
  - interface_detail_zoom
  - evidence_stack
  - source_proof_montage
  - focal_document
  - interface_before_after
  - workflow_morph
  - interface_focus_shift
visual_editor:
  enabled: true
  max_passes: 2
  max_story_calls: 12
  review_all_stories: false
  failure_mode: keep_original
asset_availability_policy:
  catalog_asset_required_render_kinds:
  - source_article_scene
  - quote_or_claim_highlight_scene
  - context_image_scene
  - broll_video_scene
  - browser_walkthrough_scene
scene_policy:
  target_aspect_ratio: '16:9'
  max_scenes: 64
  min_scene_seconds: 3
  max_scene_seconds: 14
  hard_max_scene_seconds: 16
  hard_cap_tolerance_seconds: 0.25
  semantic_min_scene_seconds: 5
  semantic_target_scene_seconds: 9
  semantic_max_units_per_scene: 4
  compact_per_chunk_scenes: true
  unit_assignment_mode: one_scene_per_script_unit
  duplicate_subscene_policy: continue
  min_scenes_per_story: 3
  max_scenes_per_story: 12
  max_source_article_scenes: 20
  max_context_image_scenes: 14
  max_broll_video_scenes: 4
  max_logo_reveal_scenes: 24
  max_editorial_text_scenes: 20
  max_simple_explainer_scenes: 24
  max_story_transition_scenes: 12
  max_quote_or_claim_highlight_scenes: 18
  max_browser_walkthrough_scenes: 12
  max_document_stack_scenes: 12
  max_interface_transform_scenes: 12
  max_consecutive_same_kind: 2
  allowed_render_kinds:
  - source_article_scene
  - context_image_scene
  - broll_video_scene
  - logo_reveal_scene
  - editorial_text_scene
  - simple_explainer_scene
  - story_transition_scene
  - quote_or_claim_highlight_scene
  - browser_walkthrough_scene
  - document_stack_scene
  - interface_transform_scene
sequence_policy:
  enabled: true
  min_sequence_seconds: 25
  target_sequence_seconds: 35
  max_sequence_seconds: 45
  min_shots_per_sequence: 2
  max_shots_per_sequence: 4
  neighboring_unit_context: 1
visual_capabilities:
  source_article_scene:
    description: Move through a real selected source page and focus an exact supplied passage.
    best_for: [visible provenance, headline reveals, source-backed details]
    required_payload_fields: [url, source_record_key, target_text, highlight_phrases, crop_strategy, overlay_headline, motion_style]
    avoid_when: [the narration is not source-specific, no selected source URL exists]
    render_notes: Use source_proof_scan, source_headline_push, or source_detail_focus; the real page remains visually dominant.
  quote_or_claim_highlight_scene:
    description: Keep a real source capture dominant while tracing one exact claim or quote in place.
    best_for: [important claims, exact quotes, visible caveats]
    required_payload_fields: [url, source_record_key, claim_text, supporting_text, target_text]
    avoid_when: [the words are not available in the selected source]
    render_notes: Use layered_evidence_reveal, evidence_split, or quote_source_focus; never render a floating dark quote card.
  context_image_scene:
    description: Use a verified story-owned image as a full-bleed or annotated visual shot.
    best_for: [people, hardware, locations, products, physical context]
    required_payload_fields: [asset_id, shot_style, overlay_headline, motion_style, show_overlay]
    avoid_when: [the image does not directly depict the active beat]
    render_notes: Use annotated_image_focus, full_bleed_image, or image_detail_sequence; annotations stay sparse and transparent.
  broll_video_scene:
    description: Use a verified story-owned video moment as a full-bleed or lightly annotated shot.
    best_for: [demos, physical action, interfaces in use, robotics]
    required_payload_fields: [asset_id, shot_style, overlay_headline, motion_style, show_overlay]
    avoid_when: [no verified video moment depicts the active beat]
    render_notes: Use annotated_video_focus, full_bleed_video, or video_detail_sequence; narration remains the only audio.
  browser_walkthrough_scene:
    description: Guide attention through a real selected webpage or interface capture.
    best_for: [product pages, documentation, specific controls, release walkthroughs]
    required_payload_fields: [url, source_record_key, headline, focus_text, walkthrough_steps]
    avoid_when: [the exact targets cannot be captured]
    render_notes: Use interface_walkthrough, guided_scroll, or interface_detail_zoom; avoid invented browser UI.
  document_stack_scene:
    description: Layer real named documents or selected source captures, then focus the relevant evidence.
    best_for: [multi-source coverage, papers, reports, release history]
    required_payload_fields: [headline, documents, focus_document_label]
    avoid_when: [only one source exists and a focused source scene is clearer]
    render_notes: Use evidence_stack, source_proof_montage, or focal_document; document surfaces may be opaque but surrounding graphics remain transparent.
  logo_reveal_scene:
    description: Introduce one or two verified identities without placing them inside a logo card.
    best_for: [first entity mentions, partnerships, short identity resets]
    required_payload_fields: [entities, primary_entity, logo_strategy, companion_text, motion_style]
    avoid_when: [the logo is merely decorative or the identity is ambiguous]
    render_notes: Use identity_reveal, identity_lockup, or identity_pair_reveal against the episode palette.
  story_transition_scene:
    description: Open each story with a complete chapter title and an optional verified visual anchor.
    best_for: [the deterministic first beat of each selected story]
    required_payload_fields: [headline, accent_words, motion_style]
    avoid_when: [the scene is not a story boundary]
    render_notes: Use chapter_opener, chapter_media_opener, or chapter_identity_opener; never use a dashboard-style title card.
  editorial_text_scene:
    description: Punctuate one short hook, punchline, or reset with expressive typography and whitespace.
    best_for: [intro hooks, jokes, one concise implication]
    required_payload_fields: [headline, accent_words, composition, motion_style]
    avoid_when: [real media or source proof can communicate the beat]
    render_notes: Use editorial_hook, editorial_punchline, or editorial_reset; never display sliced narration fragments.
  simple_explainer_scene:
    description: Explain one small mechanism or contrast using two to four large labels and restrained connectors.
    best_for: [cause and effect, short workflows, conceptual contrasts]
    required_payload_fields: [headline, items, orientation, motion_style]
    avoid_when: [more than four ideas are needed or the relationship is unsupported]
    render_notes: Use mechanism_steps, causal_chain, or concept_contrast; this is an open composition, not a flowchart card.
  interface_transform_scene:
    description: Morph between supported before and after workflow states in one open composition.
    best_for: [manual-to-agent workflows, product behavior changes]
    required_payload_fields: [headline, before, after, transformation_label]
    avoid_when: [the before or after state would be invented]
    render_notes: Use interface_before_after, workflow_morph, or interface_focus_shift; panels represent the interface only, not decorative chrome.
source_policy:
  use_selected_stories_only: true
  include_full_records: true
  max_story_context_chars: 500000

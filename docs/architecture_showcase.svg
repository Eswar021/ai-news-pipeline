<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Content Creation Pipeline Architecture</title>
  <desc id="desc">High-level architecture diagram showing sources, processing, AI production, quality checks, and deliverables.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#f6f7fb"/>
      <stop offset="100%" stop-color="#eef7f1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 2 2 L 12 7 L 2 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .stage-title { font: 700 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0.04em; text-transform: uppercase; }
      .node-title { font: 700 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-subtitle { font: 400 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .stage { fill: rgba(255,255,255,0.74); stroke: #cbd5e1; stroke-width: 1.5; }
      .node { stroke-width: 2; rx: 20; filter: url(#soft-shadow); }
      .data-node { fill: #eff6ff; stroke: #2563eb; }
      .ai-node { fill: #fffbeb; stroke: #d97706; }
      .quality-node { fill: #ecfdf5; stroke: #059669; }
      .output-node { fill: #f5f3ff; stroke: #7c3aed; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-light { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); opacity: 0.85; }
    </style>
  </defs>

  <rect width="1800" height="900" fill="url(#page-bg)"/>
  <text x="90" y="70" class="title">AI Content Creation Pipeline</text>
  <text x="90" y="104" class="subtitle">Turns live AI/news signals into a source-grounded YouTube publishing package with script, metadata, and voiceover.</text>

  <rect x="70" y="145" width="250" height="545" rx="28" class="stage"/>
  <text x="100" y="190" class="stage-title">Ingestion</text>

  <rect x="105" y="235" width="180" height="104" rx="20" class="node data-node"/>
  <text x="195" y="280" text-anchor="middle" class="node-title">Sources</text>
  <text x="195" y="306" text-anchor="middle" class="node-subtitle">Blogs, APIs, arXiv</text>

  <rect x="105" y="435" width="180" height="118" rx="20" class="node data-node"/>
  <text x="195" y="482" text-anchor="middle" class="node-title">Collection</text>
  <text x="195" y="508" text-anchor="middle" class="node-subtitle">Python collectors</text>

  <rect x="390" y="145" width="260" height="545" rx="28" class="stage"/>
  <text x="420" y="190" class="stage-title">Processing</text>

  <rect x="430" y="235" width="180" height="118" rx="20" class="node data-node"/>
  <text x="520" y="282" text-anchor="middle" class="node-title">Evidence Prep</text>
  <text x="520" y="308" text-anchor="middle" class="node-subtitle">Clean, normalize</text>

  <rect x="430" y="435" width="180" height="118" rx="20" class="node data-node"/>
  <text x="520" y="482" text-anchor="middle" class="node-title">Story Map</text>
  <text x="520" y="508" text-anchor="middle" class="node-subtitle">Embeddings + LLM</text>

  <rect x="720" y="145" width="330" height="545" rx="28" class="stage"/>
  <text x="750" y="190" class="stage-title">AI Production</text>

  <rect x="765" y="220" width="240" height="100" rx="20" class="node ai-node"/>
  <text x="885" y="263" text-anchor="middle" class="node-title">Video Packaging</text>
  <text x="885" y="288" text-anchor="middle" class="node-subtitle">Selection + timing</text>

  <rect x="765" y="350" width="240" height="100" rx="20" class="node ai-node"/>
  <text x="885" y="393" text-anchor="middle" class="node-title">Script Generation</text>
  <text x="885" y="418" text-anchor="middle" class="node-subtitle">LLM + reflection</text>

  <rect x="765" y="480" width="240" height="100" rx="20" class="node ai-node"/>
  <text x="885" y="523" text-anchor="middle" class="node-title">Metadata</text>
  <text x="885" y="548" text-anchor="middle" class="node-subtitle">Titles, chapters, tags</text>

  <rect x="765" y="610" width="240" height="100" rx="20" class="node ai-node"/>
  <text x="885" y="653" text-anchor="middle" class="node-title">Voiceover</text>
  <text x="885" y="678" text-anchor="middle" class="node-subtitle">Local TTS models</text>

  <rect x="1120" y="145" width="270" height="545" rx="28" class="stage"/>
  <text x="1150" y="190" class="stage-title">Quality</text>

  <rect x="1155" y="315" width="200" height="108" rx="20" class="node quality-node"/>
  <text x="1255" y="361" text-anchor="middle" class="node-title">Verification</text>
  <text x="1255" y="386" text-anchor="middle" class="node-subtitle">Source support checks</text>

  <rect x="1155" y="510" width="200" height="108" rx="20" class="node quality-node"/>
  <text x="1255" y="556" text-anchor="middle" class="node-title">Memory</text>
  <text x="1255" y="581" text-anchor="middle" class="node-subtitle">Approved-run learning</text>

  <rect x="1460" y="145" width="270" height="545" rx="28" class="stage"/>
  <text x="1490" y="190" class="stage-title">Deliverables</text>

  <rect x="1495" y="315" width="200" height="108" rx="20" class="node output-node"/>
  <text x="1595" y="361" text-anchor="middle" class="node-title">Publish Pack</text>
  <text x="1595" y="386" text-anchor="middle" class="node-subtitle">Script, metadata, audio</text>

  <rect x="1495" y="510" width="200" height="108" rx="20" class="node output-node"/>
  <text x="1595" y="556" text-anchor="middle" class="node-title">Artifacts</text>
  <text x="1595" y="581" text-anchor="middle" class="node-subtitle">JSON, notebook, WAV</text>

  <path d="M 195 340 L 195 423" class="arrow"/>
  <path d="M 285 494 C 340 494 365 294 418 294" class="arrow"/>
  <path d="M 520 354 L 520 423" class="arrow"/>
  <path d="M 610 494 C 660 494 690 270 753 270" class="arrow"/>
  <path d="M 885 321 L 885 338" class="arrow"/>
  <path d="M 885 451 L 885 468" class="arrow-light"/>
  <path d="M 885 581 L 885 598" class="arrow-light"/>
  <path d="M 1005 400 C 1060 400 1095 369 1143 369" class="arrow"/>
  <path d="M 1005 530 C 1070 530 1095 405 1143 386" class="arrow-light"/>
  <path d="M 1005 660 C 1190 660 1335 369 1483 369" class="arrow-light"/>
  <path d="M 1355 369 L 1483 369" class="arrow"/>
  <path d="M 1595 424 L 1595 498" class="arrow"/>
  <path d="M 1495 565 C 1425 565 1410 565 1367 565" class="arrow-light"/>

  <text x="90" y="815" class="subtitle">Caption: A modular AI production system that monitors trusted sources, clusters stories, writes grounded scripts, creates publishing metadata, and prepares audio-ready deliverables.</text>
</svg>
